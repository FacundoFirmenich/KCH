[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kch-csi-self-governance"
version = "0.1.0"
description = "Loss-aware HARNESS > AGENTS > RULES compiler for KwanCode Harness"
requires-python = ">=3.11"

[project.scripts]
kch-csi-governance = "kch_self_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
