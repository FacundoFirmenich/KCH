name: Helical v0.8 exact-source acquisition gate

on:
  push:
    branches:
      - helical-v08-exact-source-gate-20261008
    paths:
      - .github/workflows/helical-v08-exact-source-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helical-v08-exact-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-exact-public-bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire exact Mendeley and immutable GitHub bodies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          DATASET_ID = "2np9vw5v7w"
          VERSION = 2
          DOI = "10.17632/2np9vw5v7w.2"
          REQUIRED_BASENAME = "focmec_ca_final.pickle"
          SNAPSHOT_URL = f"https://api.data.mendeley.com/datasets/{DATASET_ID}?version={VERSION}"
          FAULT_REPOSITORY = "GEMScienceTools/gem-global-active-faults"
          FAULT_COMMIT = "56816508ad92fd6846dad1163b1c8c01376a2cd1"
          FAULT_PATH = "geojson/gem_active_faults_harmonized.geojson"
          FAULT_URL = (
              "https://raw.githubusercontent.com/"
              f"{FAULT_REPOSITORY}/{FAULT_COMMIT}/{FAULT_PATH}"
          )
          EXPECTED_FAULT_BLOB_SHA1 = "fb164770b529695544fa864abe2cc9dd8aa5793d"
          EXPECTED_FAULT_BYTES = 29636622

          out = Path(os.environ["RUNNER_TEMP"]) / "helical-v08-exact-source"
          out.mkdir(parents=True, exist_ok=True)

          def utc_now() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          class RedirectRecorder(urllib.request.HTTPRedirectHandler):
              def __init__(self) -> None:
                  super().__init__()
                  self.events: list[dict[str, Any]] = []

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.events.append(
                      {
                          "from_url": req.full_url,
                          "to_url": newurl,
                          "status": int(code),
                      }
                  )
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          redirects = RedirectRecorder()
          opener = urllib.request.build_opener(redirects)

          def request(url: str, accept: str) -> tuple[bytes, dict[str, Any]]:
              start = len(redirects.events)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Accept-Encoding": "identity",
                      "User-Agent": "KCH-KwanBlocks-Helical-Lift/0.8 exact-source gate",
                  },
              )
              requested_at = utc_now()
              with opener.open(req, timeout=300) as response:
                  data = response.read()
                  receipt = {
                      "requested_at_utc": requested_at,
                      "completed_at_utc": utc_now(),
                      "requested_url": url,
                      "effective_url": response.geturl(),
                      "status": int(response.status),
                      "headers": {str(k): str(v) for k, v in response.headers.items()},
                      "redirect_chain": redirects.events[start:],
                      "bytes": len(data),
                      "sha256": sha256(data),
                  }
              if receipt["status"] != 200:
                  raise RuntimeError(f"unexpected HTTP status {receipt['status']} for {url}")
              return data, receipt

          def walk_files(value: Any) -> list[dict[str, Any]]:
              rows: list[dict[str, Any]] = []
              if isinstance(value, dict):
                  filename = value.get("filename") or value.get("file_name") or value.get("name")
                  file_id = value.get("id") or value.get("uuid") or value.get("file_id")
                  if filename and file_id:
                      rows.append(
                          {
                              "filename": str(filename),
                              "file_id": str(file_id),
                              "raw": value,
                          }
                      )
                  for child in value.values():
                      rows.extend(walk_files(child))
              elif isinstance(value, list):
                  for child in value:
                      rows.extend(walk_files(child))
              return rows

          body: dict[str, Any] = {
              "format": "KCH_HELICAL_V0_8_EXACT_SOURCE_ACQUISITION",
              "dataset_id": DATASET_ID,
              "dataset_version": VERSION,
              "dataset_doi": DOI,
              "required_basename": REQUIRED_BASENAME,
              "fault_repository": FAULT_REPOSITORY,
              "fault_commit": FAULT_COMMIT,
              "fault_path": FAULT_PATH,
              "workflow_repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow_ref": os.environ.get("GITHUB_REF"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "started_at_utc": utc_now(),
              "network_plane": "GITHUB_ACTIONS_PUBLIC_EGRESS",
              "deserialization_performed": False,
              "angle_fields_accessed": False,
              "scientific_execution_performed": False,
              "authority_ceiling": "NONE",
              "promotion": "BLOCKED",
          }

          try:
              snapshot_bytes, snapshot_receipt = request(SNAPSHOT_URL, "application/json")
              snapshot_path = out / "mendeley_dataset_snapshot_v2.json"
              snapshot_path.write_bytes(snapshot_bytes)
              snapshot = json.loads(snapshot_bytes.decode("utf-8"))

              observed_version = snapshot.get("version")
              if observed_version is not None and int(observed_version) != VERSION:
                  raise RuntimeError(f"Mendeley version mismatch: {observed_version}")
              observed_doi = str(snapshot.get("doi") or "")
              if observed_doi and observed_doi.lower() != DOI.lower():
                  raise RuntimeError(f"Mendeley DOI mismatch: {observed_doi}")

              matches = [
                  row for row in walk_files(snapshot)
                  if Path(row["filename"]).name == REQUIRED_BASENAME
              ]
              unique = {(row["filename"], row["file_id"]): row for row in matches}
              matches = list(unique.values())
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one exact Mendeley file match; observed {len(matches)}"
                  )

              selected = matches[0]
              raw = selected["raw"]
              details = raw.get("content_details") if isinstance(raw, dict) else None
              download_url = details.get("download_url") if isinstance(details, dict) else None
              if not download_url:
                  download_url = (
                      f"https://api.data.mendeley.com/public-files/datasets/{DATASET_ID}/"
                      f"files/{selected['file_id']}/file_downloaded"
                  )
              parsed = urllib.parse.urlparse(str(download_url))
              if parsed.scheme != "https" or parsed.hostname != "api.data.mendeley.com":
                  raise RuntimeError(f"inadmissible Mendeley download URL: {download_url}")
              if DATASET_ID not in parsed.path or selected["file_id"] not in parsed.path:
                  raise RuntimeError("Mendeley download URL is not bound to selected snapshot entity")

              mechanism_bytes, mechanism_receipt = request(
                  str(download_url), "application/octet-stream"
              )
              expected_size = raw.get("size") if isinstance(raw, dict) else None
              if expected_size is not None and len(mechanism_bytes) != int(expected_size):
                  raise RuntimeError(
                      f"Mendeley size mismatch: {len(mechanism_bytes)} != {expected_size}"
                  )
              if not mechanism_bytes:
                  raise RuntimeError("empty focal-mechanism body")
              mechanism_path = out / REQUIRED_BASENAME
              mechanism_path.write_bytes(mechanism_bytes)

              fault_bytes, fault_receipt = request(
                  FAULT_URL, "application/geo+json,application/json"
              )
              if len(fault_bytes) != EXPECTED_FAULT_BYTES:
                  raise RuntimeError(
                      f"fault byte-size mismatch: {len(fault_bytes)} != {EXPECTED_FAULT_BYTES}"
                  )
              git_blob_sha1 = hashlib.sha1(
                  b"blob " + str(len(fault_bytes)).encode("ascii") + b"\0" + fault_bytes
              ).hexdigest()
              if git_blob_sha1 != EXPECTED_FAULT_BLOB_SHA1:
                  raise RuntimeError(
                      f"fault Git blob mismatch: {git_blob_sha1} != {EXPECTED_FAULT_BLOB_SHA1}"
                  )
              json.loads(fault_bytes.decode("utf-8"))
              fault_path = out / "gem_active_faults_harmonized.geojson"
              fault_path.write_bytes(fault_bytes)

              body.update(
                  outcome="EXACT_BYTE_ACQUISITION_PASS",
                  all_or_none_pass=True,
                  snapshot_receipt=snapshot_receipt,
                  selected_mendeley_file={
                      "filename": selected["filename"],
                      "file_id": selected["file_id"],
                      "snapshot_declared_size": expected_size,
                      "download_url": str(download_url),
                  },
                  mechanism_receipt=mechanism_receipt,
                  fault_receipt={
                      **fault_receipt,
                      "git_blob_sha1": git_blob_sha1,
                      "expected_git_blob_sha1": EXPECTED_FAULT_BLOB_SHA1,
                  },
                  completed_at_utc=utc_now(),
              )
          except Exception as exc:
              body.update(
                  outcome="BLOCKED_EXACT_BYTE_ACQUISITION",
                  all_or_none_pass=False,
                  error_type=type(exc).__name__,
                  error=str(exc),
                  completed_at_utc=utc_now(),
              )
              status = 3
          else:
              status = 0

          content = dict(body)
          body["receipt_id"] = "h8acqremote:" + hashlib.sha256(canonical(content)).hexdigest()
          receipt_path = out / "ACQUISITION_RECEIPT_V0_8_REMOTE.json"
          receipt_path.write_text(
              json.dumps(body, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          sums = []
          for path in sorted(out.iterdir(), key=lambda p: p.name):
              if path.is_file():
                  sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (out / "SOURCE_SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")
          print(json.dumps(body, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False))
          raise SystemExit(status)
          PY

      - name: Upload exact-source evidence regardless of gate outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: helical-v08-exact-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/helical-v08-exact-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
