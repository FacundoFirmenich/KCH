name: Helical v0.8 exact-source acquisition gate

on:
  push:
    branches:
      - helical-v08-exact-source-gate-20261008
    paths:
      - .github/workflows/helical-v08-exact-source-gate.yml
      - .github/scripts/helical_v08_acquire.py
      - .github/scripts/mendeley_public_file_discovery.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helical-v08-exact-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-official-public-file-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover exact public file identity through official frontend plane
        run: python .github/scripts/mendeley_public_file_discovery.py

      - name: Upload discovery evidence regardless of gate outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: helical-v08-public-file-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/helical-v08-public-file-discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
