name: Helical v0.8 exact-source acquisition gate

on:
  push:
    branches:
      - helical-v08-exact-source-gate-20261008
    paths:
      - .github/workflows/helical-v08-exact-source-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helical-v08-exact-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-exact-public-bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire exact Mendeley and immutable GitHub bodies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          DATASET_ID = "2np9vw5v7w"
          VERSION = 2
          DOI = "10.17632/2np9vw5v7w.2"
          REQUIRED_BASENAME = "focmec_ca_final.pickle"
          PUBLIC_FILE_ID = "51b869ad-2a13-4860-8d13-a259d0864fd9"
          EXPECTED_MECHANISM_BYTES = 10979993
          PUBLIC_RECORD_URL = f"https://data.mendeley.com/datasets/compare/{DATASET_ID}"
          PUBLIC_DOWNLOAD_URL = (
              f"https://api.data.mendeley.com/public-files/datasets/{DATASET_ID}/"
              f"files/{PUBLIC_FILE_ID}/file_downloaded"
          )

          FAULT_REPOSITORY = "GEMScienceTools/gem-global-active-faults"
          FAULT_COMMIT = "56816508ad92fd6846dad1163b1c8c01376a2cd1"
          FAULT_PATH = "geojson/gem_active_faults_harmonized.geojson"
          FAULT_URL = (
              "https://raw.githubusercontent.com/"
              f"{FAULT_REPOSITORY}/{FAULT_COMMIT}/{FAULT_PATH}"
          )
          EXPECTED_FAULT_BLOB_SHA1 = "fb164770b529695544fa864abe2cc9dd8aa5793d"
          EXPECTED_FAULT_BYTES = 29636622

          out = Path(os.environ["RUNNER_TEMP"]) / "helical-v08-exact-source"
          out.mkdir(parents=True, exist_ok=True)

          def utc_now() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          class RedirectRecorder(urllib.request.HTTPRedirectHandler):
              def __init__(self) -> None:
                  super().__init__()
                  self.events: list[dict[str, Any]] = []

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.events.append(
                      {"from_url": req.full_url, "to_url": newurl, "status": int(code)}
                  )
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          redirects = RedirectRecorder()
          opener = urllib.request.build_opener(redirects)

          def request(url: str, accept: str) -> tuple[bytes, dict[str, Any]]:
              start = len(redirects.events)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Accept-Encoding": "identity",
                      "User-Agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                          "KCH-KwanBlocks-Helical-Lift-v0.8"
                      ),
                  },
              )
              requested_at = utc_now()
              with opener.open(req, timeout=300) as response:
                  data = response.read()
                  receipt = {
                      "requested_at_utc": requested_at,
                      "completed_at_utc": utc_now(),
                      "requested_url": url,
                      "effective_url": response.geturl(),
                      "status": int(response.status),
                      "headers": {str(k): str(v) for k, v in response.headers.items()},
                      "redirect_chain": redirects.events[start:],
                      "bytes": len(data),
                      "sha256": sha256(data),
                  }
              if receipt["status"] != 200:
                  raise RuntimeError(f"unexpected HTTP status {receipt['status']} for {url}")
              return data, receipt

          body: dict[str, Any] = {
              "format": "KCH_HELICAL_V0_8_EXACT_SOURCE_ACQUISITION",
              "dataset_id": DATASET_ID,
              "dataset_version": VERSION,
              "dataset_doi": DOI,
              "required_basename": REQUIRED_BASENAME,
              "public_file_id": PUBLIC_FILE_ID,
              "expected_mechanism_bytes": EXPECTED_MECHANISM_BYTES,
              "metadata_binding_mode": "PUBLIC_COMPARE_PAGE_PLUS_FROZEN_PUBLIC_FILE_UUID",
              "authenticated_api_used": False,
              "credentials_used": False,
              "fault_repository": FAULT_REPOSITORY,
              "fault_commit": FAULT_COMMIT,
              "fault_path": FAULT_PATH,
              "workflow_repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow_ref": os.environ.get("GITHUB_REF"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "started_at_utc": utc_now(),
              "network_plane": "GITHUB_ACTIONS_PUBLIC_EGRESS",
              "deserialization_performed": False,
              "angle_fields_accessed": False,
              "scientific_execution_performed": False,
              "authority_ceiling": "NONE",
              "promotion": "BLOCKED",
          }

          try:
              record_bytes, record_receipt = request(PUBLIC_RECORD_URL, "text/html")
              record_text = record_bytes.decode("utf-8", errors="strict")
              required_markers = (DOI, "Version 2", REQUIRED_BASENAME)
              absent = [marker for marker in required_markers if marker not in record_text]
              if absent:
                  raise RuntimeError(f"public record missing frozen markers: {absent}")
              record_path = out / "mendeley_public_comparison_record.html"
              record_path.write_bytes(record_bytes)

              parsed = urllib.parse.urlparse(PUBLIC_DOWNLOAD_URL)
              if parsed.scheme != "https" or parsed.hostname != "api.data.mendeley.com":
                  raise RuntimeError("inadmissible public-file download host")
              if DATASET_ID not in parsed.path or PUBLIC_FILE_ID not in parsed.path:
                  raise RuntimeError("public-file URL is not bound to frozen dataset and file UUID")

              mechanism_bytes, mechanism_receipt = request(
                  PUBLIC_DOWNLOAD_URL, "application/octet-stream"
              )
              if len(mechanism_bytes) != EXPECTED_MECHANISM_BYTES:
                  raise RuntimeError(
                      f"Mendeley byte-size mismatch: {len(mechanism_bytes)} != "
                      f"{EXPECTED_MECHANISM_BYTES}"
                  )
              if not mechanism_bytes:
                  raise RuntimeError("empty focal-mechanism body")
              mechanism_path = out / REQUIRED_BASENAME
              mechanism_path.write_bytes(mechanism_bytes)

              fault_bytes, fault_receipt = request(
                  FAULT_URL, "application/geo+json,application/json"
              )
              if len(fault_bytes) != EXPECTED_FAULT_BYTES:
                  raise RuntimeError(
                      f"fault byte-size mismatch: {len(fault_bytes)} != {EXPECTED_FAULT_BYTES}"
                  )
              git_blob_sha1 = hashlib.sha1(
                  b"blob " + str(len(fault_bytes)).encode("ascii") + b"\0" + fault_bytes
              ).hexdigest()
              if git_blob_sha1 != EXPECTED_FAULT_BLOB_SHA1:
                  raise RuntimeError(
                      f"fault Git blob mismatch: {git_blob_sha1} != {EXPECTED_FAULT_BLOB_SHA1}"
                  )
              json.loads(fault_bytes.decode("utf-8"))
              fault_path = out / "gem_active_faults_harmonized.geojson"
              fault_path.write_bytes(fault_bytes)

              body.update(
                  outcome="EXACT_BYTE_ACQUISITION_PASS",
                  all_or_none_pass=True,
                  public_record_receipt=record_receipt,
                  selected_mendeley_file={
                      "filename": REQUIRED_BASENAME,
                      "file_id": PUBLIC_FILE_ID,
                      "frozen_expected_size": EXPECTED_MECHANISM_BYTES,
                      "download_url": PUBLIC_DOWNLOAD_URL,
                  },
                  mechanism_receipt=mechanism_receipt,
                  fault_receipt={
                      **fault_receipt,
                      "git_blob_sha1": git_blob_sha1,
                      "expected_git_blob_sha1": EXPECTED_FAULT_BLOB_SHA1,
                  },
                  completed_at_utc=utc_now(),
              )
          except Exception as exc:
              body.update(
                  outcome="BLOCKED_EXACT_BYTE_ACQUISITION",
                  all_or_none_pass=False,
                  error_type=type(exc).__name__,
                  error=str(exc),
                  completed_at_utc=utc_now(),
              )
              status = 3
          else:
              status = 0

          content = dict(body)
          body["receipt_id"] = "h8acqremote:" + hashlib.sha256(canonical(content)).hexdigest()
          receipt_path = out / "ACQUISITION_RECEIPT_V0_8_REMOTE.json"
          receipt_path.write_text(
              json.dumps(body, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          sums = []
          for path in sorted(out.iterdir(), key=lambda p: p.name):
              if path.is_file():
                  sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (out / "SOURCE_SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")
          print(json.dumps(body, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False))
          raise SystemExit(status)
          PY

      - name: Upload exact-source evidence regardless of gate outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: helical-v08-exact-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/helical-v08-exact-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
