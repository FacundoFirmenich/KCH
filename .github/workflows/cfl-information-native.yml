name: CFL native information contract CPU BF16
on:
  push:
    branches: [exp/cfl-information-native-20260929]
    paths:
      - 'experiments/cfl_information_native/v0_1_1/**'
      - '.github/workflows/cfl-information-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfl-information-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-model-acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      CFL_NATIVE_OUTPUT: native_results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record CPU BF16 execution hardware
        run: |
          free -h
          df -h
          lscpu
      - name: Install the runtime on the remote worker
        run: |
          python -m pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'git+https://github.com/huggingface/transformers.git@96331a9f93b72697f160a958d2883d4b49a56739' accelerate pandas numpy pytest pillow
          python -m pip freeze > runtime_freeze.txt
      - name: Run actual Qwen3.5-4B-Base paired generation and native captures
        run: |
          set -o pipefail
          python experiments/cfl_information_native/v0_1_1/reviewed_run.py 2>&1 | tee native_console.log
      - name: Preserve native results and diagnostic failure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfl-information-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native_results/
            native_console.log
            runtime_freeze.txt
            experiments/cfl_information_native/v0_1_1/
          if-no-files-found: error
          retention-days: 7
