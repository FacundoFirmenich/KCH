name: KCH Helical v0.17.5.1 replay-drift diagnostic and frozen-lock binding

on:
  push:
    branches:
      - helical-v0175-1-real-calibration-binding-replay-drift-20261012
    paths:
      - ".github/workflows/helical-v0175-1-replay-drift-binding.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0175-1-replay-drift-${{ github.ref }}
  cancel-in-progress: false

env:
  V10: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009
  V11: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009
  V12: construct_successors/KCH_HELICAL_V012_PARENT_GRAPH_LOCK_20261009
  V174: construct_successors/KCH_HELICAL_V0174_CALIBRATION_RUNTIME_QUALIFICATION_20261012
  ROOT: construct_successors/KCH_HELICAL_V0175_1_REAL_CALIBRATION_BINDING_REPLAY_DRIFT_20261012
  PROTOCOL: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/protocol/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json
  ELIGIBILITY: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/results/run-37919577887-1/BLIND_ELIGIBILITY_RESULT_V0_10.json
  V11_RUN: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009/results/run-37920569317-1/RUN_RECEIPT_V0_11.json
  V11_PREFLIGHT: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009/results/run-37920569317-1/DIRECTIONAL_PREFLIGHT_RESULT_V0_11.json
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  replay-drift-and-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout complete lineage
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0175-1-real-calibration-binding-replay-drift-20261012
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact historical inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir numpy==2.1.3 scipy==1.14.1 pyproj==3.7.0 shapely==2.0.6
          python -m pip freeze --all | LC_ALL=C sort > "$RUNNER_TEMP/pip-freeze-current.txt"
          diff -u "$V12/results/run-37921233515-1/PIP_FREEZE.txt" "$RUNNER_TEMP/pip-freeze-current.txt"

      - name: Verify frozen tolerance authority and code
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/FAILURE_RECEIPT_V0_17_5_RUN1.json" >/dev/null
          python -m json.tool "$ROOT/NUMERICAL_REPLAY_TOLERANCE_CONTRACT_V0_17_5_1.json" >/dev/null
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_17_5_1.json" >/dev/null
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_17_5_1_PARENT_REPLAY.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/v01751/pycache"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v01751/pycache" python -m py_compile             "$ROOT/replay_compare_v0175_1.py" "$ROOT/adjudicate_replay_drift_v0175_1.py"             "$V12/helical_v012_parent_graph_gate.py" "$V12/build_topology_lock_v012.py"             "$V12/directional_preflight_frozen_v08.py" "$V12/fit_parent_graph_lock_frozen_v08.py"             "$V11/extract_blind_v011.py" "$V11/extract_selected_directional_v011.py"             "$V11/helical_v011_directional_pretest.py" "$V11/helical_v011_directional_pretest_core.py"             "$V10/helical_remote_gate.py" "$V10/helical_public_acquisition.py" "$V10/helical_geometry_adapter.py"

      - name: Freeze exact networkless extraction images
        shell: bash
        run: |
          set -euo pipefail
          images="$RUNNER_TEMP/v01751/images"; mkdir -p "$images/blind" "$images/directional"
          base="docker.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89"
          docker pull "$base"
          python -m pip download --only-binary=:all: --no-deps --dest "$images" numpy==2.1.3
          wheel=$(find "$images" -maxdepth 1 -name 'numpy-*.whl' -type f -print -quit)
          test -n "$wheel"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "bc6f24b3d1ecc1eebfbf5d6051faa49af40b03be1aaa781ebdadcbc090b4539b"
          cp "$wheel" "$images/blind/"; cp "$wheel" "$images/directional/"
          cp "$V11/extract_blind_v011.py" "$images/blind/extractor.py"
          cp "$V11/extract_selected_directional_v011.py" "$images/directional/extractor.py"
          wheel_name=$(basename "$wheel")
          for kind in blind directional; do
            cat > "$images/$kind/Dockerfile" <<EOF
          FROM $base
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
          COPY $wheel_name /wheels/$wheel_name
          RUN pip install --no-cache-dir --no-index /wheels/$wheel_name && rm -rf /wheels
          COPY extractor.py /app/extractor.py
          ENTRYPOINT ["python", "/app/extractor.py"]
          EOF
            docker build --pull=false --network=none -t "kch-helical-v01751-$kind:locked" "$images/$kind"
          done
          rm -rf "$images"

      - name: Execute second exact parent-fit replay diagnostic
        id: replay
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/v01751/work"; mkdir -p "$RUNNER_TEMP/v01751/work"
          PYTHONPATH="$GITHUB_WORKSPACE/$V10:$GITHUB_WORKSPACE/$V11:$GITHUB_WORKSPACE/$V12"           python "$V12/helical_v012_parent_graph_gate.py"             --protocol "$PROTOCOL"             --authority "$ROOT/AUTHORITY_LEASE_V0_17_5_1_PARENT_REPLAY.json"             --eligibility-result "$ELIGIBILITY" --v11-run "$V11_RUN" --v11-preflight "$V11_PREFLIGHT"             --directional-preflight-runtime "$V12/directional_preflight_frozen_v08.py"             --topology-runtime "$V12/build_topology_lock_v012.py"             --parent-graph-runtime "$V12/fit_parent_graph_lock_frozen_v08.py"             --workspace "$RUNNER_TEMP/v01751/work"             --blind-image kch-helical-v01751-blind:locked             --directional-image kch-helical-v01751-directional:locked             --timeout 1200 > "$RUNNER_TEMP/v01751/replay.stdout" 2> "$RUNNER_TEMP/v01751/replay.stderr"
          rc=$?
          set -e
          echo "replay_exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -c 12000 "$RUNNER_TEMP/v01751/replay.stdout" || true
          tail -c 12000 "$RUNNER_TEMP/v01751/replay.stderr" >&2 || true

      - name: Persist safe replay aggregates before adjudication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/replay_safe"
          mkdir -p "$ROOT/replay_safe"
          cp -a "$RUNNER_TEMP/v01751/work/results/." "$ROOT/replay_safe/"
          cp "$RUNNER_TEMP/pip-freeze-current.txt" "$ROOT/replay_safe/CURRENT_PIP_FREEZE.txt"
          printf '%s\n' "${{ steps.replay.outputs.replay_exit_code }}" > "$ROOT/replay_safe/REPLAY_EXIT_CODE.txt"
          if find "$ROOT/replay_safe" -type f \( -name '*.pickle' -o -name '*.pkl' -o -name '*.npz' -o -name '*.npy' -o -name '*.geojson' -o -name '*.csv' -o -name '*.parquet' \) | grep -q .; then
            echo "row-level/raw payload escaped replay enclave" >&2; exit 91
          fi
          test ! -e "$RUNNER_TEMP/v01751/work/raw"
          test ! -e "$RUNNER_TEMP/v01751/work/selected_root"
          test ! -e "$RUNNER_TEMP/v01751/work/topology"
          test ! -e "$RUNNER_TEMP/v01751/work/parent_graph"

      - name: Adjudicate replay drift under predeclared tolerance
        id: adjudicate
        shell: bash
        run: |
          set +e
          rm -rf "$ROOT/results"; mkdir -p "$ROOT/results"
          PYTHONPATH="$GITHUB_WORKSPACE/$ROOT" python "$ROOT/adjudicate_replay_drift_v0175_1.py"             --repo-root "$GITHUB_WORKSPACE"             --replay-results "$ROOT/replay_safe"             --v0174-results "$V174/results"             --contract "$ROOT/NUMERICAL_REPLAY_TOLERANCE_CONTRACT_V0_17_5_1.json"             --output "$ROOT/results"
          rc=$?
          set -e
          echo "adjudication_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist diagnostic and binding receipts append-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0175-1-replay-drift"
          git config user.email "kch-helical-v0175-1-replay-drift@users.noreply.github.com"
          git add "$ROOT/replay_safe" "$ROOT/results"
          if git diff --cached --quiet; then echo "No replay-drift delta"; else
            git commit -m "record v0.17.5.1 parent refit replay-drift diagnostic [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload replay-drift diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0175-1-replay-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROOT }}/replay_safe
            ${{ env.ROOT }}/results
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Final adjudication after immutable persistence
        if: always()
        shell: bash
        env:
          REPLAY_RC: ${{ steps.replay.outputs.replay_exit_code }}
          ADJ_RC: ${{ steps.adjudicate.outputs.adjudication_exit_code }}
        run: |
          set -euo pipefail
          test "${REPLAY_RC:-99}" = "0" || { echo "exact replay failed closed: ${REPLAY_RC:-99}" >&2; exit "${REPLAY_RC:-99}"; }
          case "${ADJ_RC:-99}" in
            0) echo "V0_17_5_1_REAL_CALIBRATION_BINDING_PASS" ;;
            30) echo "V0_17_5_1_NUMERICAL_REPLAY_TOLERANCE_FAIL_CLOSED" >&2; exit 30 ;;
            *) echo "V0_17_5_1_ADJUDICATOR_FAILURE ${ADJ_RC:-99}" >&2; exit "${ADJ_RC:-99}" ;;
          esac
