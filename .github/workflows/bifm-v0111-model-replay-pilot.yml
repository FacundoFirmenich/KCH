name: BIFM v0.11.1 exact model replay pilot

on:
  push:
    branches:
      - bifm/v0.11.1-model-replay-exact
    paths:
      - .github/workflows/bifm-v0111-model-replay-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-L4-E0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout exact frozen scientific source
        uses: actions/checkout@v4
        with:
          ref: 30d2366b46657395ca4b106eae7c0667195fcb4d
          path: frozen-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache exact model and dataset bytes
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: bifm-v0111-qwen3-06b-c1899de-arc-210d026
      - name: Install inference dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers huggingface_hub pandas pyarrow accelerate safetensors
          python -m pip freeze | sort > pip-freeze.txt
      - name: Pin dataset revision in frozen collector copy
        run: |
          set -euo pipefail
          cp frozen-source/research/bifm/v0.11.1-alpha0/collect_qwen_shard.py collect_qwen_shard_pinned.py
          python - <<'PY'
          from pathlib import Path
          p=Path('collect_qwen_shard_pinned.py')
          s=p.read_text()
          old='dsha=api.dataset_info(DATASET_ID).sha'
          new='dsha="210d026faf9955653af8916fad021475a3f00453"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          sha256sum collect_qwen_shard_pinned.py > collector.sha256
      - name: Run exact revision pilot L4 E0
        env:
          BIFM_LAYER: "4"
          BIFM_EIDX: "0"
          BIFM_OUT: pilot_L4_E0
        run: |
          set -euo pipefail
          /usr/bin/time -v python collect_qwen_shard_pinned.py 2>&1 | tee pilot.log
      - name: Verify and record artifact
        run: |
          set -euo pipefail
          test -f pilot_L4_E0/qwen_L4_E0.npz
          test -f pilot_L4_E0/qwen_L4_E0_receipt.json
          sha256sum pilot_L4_E0/qwen_L4_E0.npz pilot_L4_E0/qwen_L4_E0_receipt.json pilot.log pip-freeze.txt collector.sha256 > PILOT_MANIFEST.sha256
          python - <<'PY'
          import json,hashlib,platform
          from pathlib import Path
          receipt=json.loads(Path('pilot_L4_E0/qwen_L4_E0_receipt.json').read_text())
          out={
            'status':'PASS',
            'source_commit':'30d2366b46657395ca4b106eae7c0667195fcb4d',
            'model_revision':'c1899de289a04d12100db370d81485cdf75e47ca',
            'dataset_revision':'210d026faf9955653af8916fad021475a3f00453',
            'layer':4,'epsilon_index':0,
            'historical_expected_npz_sha256':'987d74b0255f4f80c65e2108931669eec665dd086e5809a4bb3008534f555aff',
            'replayed_npz_sha256':hashlib.sha256(Path('pilot_L4_E0/qwen_L4_E0.npz').read_bytes()).hexdigest(),
            'collector_receipt':receipt,
            'claim_boundary':'Pilot from exact model/data revisions under the newly recorded software environment; byte equality with the historical NPZ is informative but not required for operator-level scientific replication.'
          }
          Path('PILOT_REPLAY_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bifm-v0111-pilot-L4-E0
          path: |
            pilot_L4_E0/
            collect_qwen_shard_pinned.py
            collector.sha256
            pip-freeze.txt
            pilot.log
            PILOT_MANIFEST.sha256
            PILOT_REPLAY_RECEIPT.json
          if-no-files-found: error
          compression-level: 0
