name: KCH Helical v0.10 exact public file-list capture

on:
  push:
    branches:
      - helical-v09-remote-gate-20261009
    paths:
      - ".github/workflows/kch-helical-v10-file-list-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Capture public root file list
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/file-list"
          mkdir -p "$out"
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'file-list'
          params=urllib.parse.urlencode({'folder_id':'root','version':2,'$start':0,'$limit':1000})
          url='https://data.mendeley.com/public-api/datasets/2np9vw5v7w/files?'+params
          req=urllib.request.Request(url,headers={'User-Agent':'KCH-KwanBlocks-Helical-Lift/0.10 public-file-list; no credentials','Accept':'application/json','Accept-Encoding':'identity'})
          with urllib.request.urlopen(req,timeout=90) as r:
              body=r.read(16*1024*1024)
              rec={'requested_url':url,'effective_url':r.geturl(),'status':int(r.getcode()),'headers':{k.lower():v for k,v in r.headers.items() if k.lower() in {'content-type','content-length','etag','last-modified'}},'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          obj=json.loads(body.decode('utf-8'))
          rows=obj if isinstance(obj,list) else obj.get('data') or obj.get('files') or obj.get('items') or []
          required=[x for x in rows if isinstance(x,dict) and x.get('filename')=='focmec_ca_final.pickle']
          rec['top_level_type']=type(obj).__name__
          rec['row_count']=len(rows)
          rec['required_match_count']=len(required)
          (out/'public-files.json').write_bytes(body)
          (out/'capture-receipt.json').write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          print(json.dumps(rec,sort_keys=True,indent=2))
          if len(required)!=1: raise SystemExit(31)
          print(json.dumps(required[0],sort_keys=True,indent=2))
          PY
      - name: Archive capture
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/file-list"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/file-list.tar.gz" .
          sha256sum "$RUNNER_TEMP/file-list.tar.gz" > "$RUNNER_TEMP/file-list.tar.gz.sha256"
      - name: Upload capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v10-file-list-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/file-list.tar.gz
            ${{ runner.temp }}/file-list.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
