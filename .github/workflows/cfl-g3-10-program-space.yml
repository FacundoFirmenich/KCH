name: CFL G3.10 generative program space

on:
  push:
    branches:
      - cfl-uep/g3-10-generative-program-space-20261004
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-g3-10:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r experiments/cfl_g3_10_program_space_20261004/requirements.txt
      - name: Materialize and verify runner
        run: |
          set -euo pipefail
          cp experiments/cfl_g3_10_program_space_20261004/run_g310.py.gz run_g310.py.gz
          echo "1d9834c8d1a7b6f48595ae351991e594d0f30eb370344b0c40d828ec11c35091  run_g310.py.gz" | sha256sum -c -
          gzip -dc run_g310.py.gz > run_g310.py
          echo "566ca8adc74102458ec3d4d98c89ac69968f65190256bfbbe2c465a50384d46a  run_g310.py" | sha256sum -c -
          python -m py_compile run_g310.py
          python -m json.tool experiments/cfl_g3_10_program_space_20261004/PRIVATE_EXECUTION_FREEZE.json >/dev/null
      - name: Reproduce consumed private reserve
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          G310_SPLIT: private
          G310_WORKDIR: ${{ github.workspace }}/g310_work
        run: |
          set -euo pipefail
          python run_g310.py 2>&1 | tee g310_stdout.log
          test -s g310_work/results/FINAL_ADJUDICATION.json
          test -s g310_work/results/SUMMARY.json
          test -s g310_work/results/METHOD_RESULTS.jsonl
          test -s g310_work/evidence/TRUTH_MANIFEST.jsonl
          test -s g310_work/results/TRANSFER_LEDGER.jsonl
          python -m json.tool g310_work/results/FINAL_ADJUDICATION.json >/dev/null
          cp g310_stdout.log g310_work/results/STDOUT.log
          cp run_g310.py g310_work/results/SOURCE_run_g310.py
          cp experiments/cfl_g3_10_program_space_20261004/EXECUTION_PROTOCOL.json g310_work/results/EXECUTION_PROTOCOL.json
          cp experiments/cfl_g3_10_program_space_20261004/PRIVATE_EXECUTION_FREEZE.json g310_work/results/PRIVATE_EXECUTION_FREEZE.json
          python -m pip freeze > g310_work/results/PIP_FREEZE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CFL_G3_10_PROGRAM_SPACE_${{ github.sha }}
          path: g310_work
          if-no-files-found: warn
          retention-days: 30
