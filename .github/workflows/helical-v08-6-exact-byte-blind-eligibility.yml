name: Helical v0.8.6 exact-byte blind eligibility

on:
  push:
    branches:
      - experiment/helical-v08-blind-eligibility-20261009
    paths:
      - '.github/workflows/helical-v08-6-exact-byte-blind-eligibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helical-v08-6-exact-byte-blind-eligibility
  cancel-in-progress: false

jobs:
  exact-byte-blind-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout immutable workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Execute governed exact-byte acquisition and blind gate
        shell: bash
        run: |
          set -euo pipefail
          GATE="$RUNNER_TEMP/gate"
          ACQUIRED="$RUNNER_TEMP/acquired"
          BLIND="$RUNNER_TEMP/blind"
          WHEELHOUSE="$RUNNER_TEMP/wheelhouse"
          mkdir -p "$GATE" "$ACQUIRED" "$BLIND" "$WHEELHOUSE" /tmp/v086

          finalize() {
            rc=$?
            set +e
            rm -f "$ACQUIRED/focmec_ca_final.pickle"
            mkdir -p "$GATE"
            (cd "$GATE" && find . -maxdepth 1 -type f ! -name COMPLETE_SHA256SUMS.txt ! -name ARTIFACT_SIZES.txt -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) > "$GATE/COMPLETE_SHA256SUMS.txt"
            du -ah "$GATE" | LC_ALL=C sort -h > "$GATE/ARTIFACT_SIZES.txt"
            exit "$rc"
          }
          trap finalize EXIT

          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile

          def unpack(root, parts, raw_size, raw_sha, archive_size, archive_sha, destination):
              root = pathlib.Path(root)
              names = {p.name for p in root.glob('part-*.b64')}
              if names != set(parts):
                  raise SystemExit(f'fragment set mismatch in {root}: {sorted(names)}')
              chunks = []
              observed = {}
              for name in sorted(parts):
                  data = (root / name).read_bytes()
                  expected_sha, expected_size = parts[name]
                  digest = hashlib.sha256(data).hexdigest()
                  observed[name] = {'bytes': len(data), 'sha256': digest}
                  if len(data) != expected_size or digest != expected_sha:
                      raise SystemExit(f'fragment mismatch {name}: {len(data)} {digest}')
                  chunks.append(data)
              raw = b''.join(chunks)
              raw_digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != raw_size or raw_digest != raw_sha:
                  raise SystemExit(f'raw bundle mismatch in {root}: {len(raw)} {raw_digest}')
              archive = base64.b64decode(b''.join(raw.split()), validate=True)
              archive_digest = hashlib.sha256(archive).hexdigest()
              if len(archive) != archive_size or archive_digest != archive_sha:
                  raise SystemExit(f'archive mismatch in {root}: {len(archive)} {archive_digest}')
              destination = pathlib.Path(destination)
              destination.mkdir(parents=True, exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
                  members = tf.getmembers()
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if member.isdir() or path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                          raise SystemExit(f'inadmissible member: {member.name}')
                  tf.extractall(path=destination, filter='data')
              return {
                  'raw_encoded_bytes': len(raw),
                  'raw_encoded_sha256': raw_digest,
                  'archive_bytes': len(archive),
                  'archive_sha256': archive_digest,
                  'parts': observed,
                  'members': sorted(m.name for m in members),
              }

          core = unpack(
              'experiments/helical-v08-1/source_bundle',
              {
                'part-00.b64': ('b1eaa90bf5b3ae98cc62a16cf29ebfdd16ecf320e67daa9f6122a64ee4f1f426', 6000),
                'part-01.b64': ('a28e53233e388169820c65df9aba143ce4db58a7acc0960de00cb24898262de7', 6000),
                'part-02.b64': ('e5d633efb1f9c253cfae5cb152c50cd8aed71dda51d62239bfdfd7501e3f7247', 6000),
                'part-03.b64': ('ddedc1091fe79f2a75dada1b9bd50e436b02ebdd6168668e2ff2389267b3383d', 6000),
                'part-04.b64': ('998dea189883f8a59e51da2dcd6be40af5e6ab0a9236ab58d9d9de5138180f2f', 6000),
                'part-05.b64': ('84df7b813ec59e207828dcbcad087f86f4e029b6ac12cd4d5c946156da5f657f', 5185),
              },
              35185,
              'daee98e8da049f7da657f349833db9d32c6c00c98d5563829cde3f026cf81edd',
              26044,
              '89f98e8776587a7dab77a8fe5d08b72653943572248d1b6e76a1edc03abd9c7d',
              '.',
          )
          overlay = unpack(
              'experiments/helical-v08-1/acquisition_bundle_v086',
              {
                'part-00.b64': ('eb085687b8e79e12bc262dd473d182f682c925632d0ffaa86e953f433c021de8', 6000),
                'part-01.b64': ('995aa622c9b4b034e08bf6df7d7140b552e81d5cf19f664ee6c7ce9601b94523', 3360),
              },
              9360,
              '0c2a62840b599ade501bbedeb05dcc9ca0a41164994920dece2cb81952f98254',
              7019,
              '0ad2643b45d3366d132a7ab0f4e634dc8ab4b36f576fc9c29715eef41951d544',
              '/tmp/v086',
          )
          expected = {
              'MENDELEY_EXACT_BYTE_ACQUISITION_V0_8_6.py': 'bc550d29ce4418eed2f6e7749e21f1ddd373f59856b0fe1060c4fc0c8c69846a',
              'BUILD_REMOTE_GATE_RECEIPT_V0_8_6.py': 'f65312299086e1a832187e145881cd8f9948630e9d9ce11deb79c752450a62f0',
          }
          for name, digest in expected.items():
              observed = hashlib.sha256((pathlib.Path('/tmp/v086') / name).read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f'overlay member mismatch {name}: {observed}')
          receipt = {
              'format': 'KCH_HELICAL_V0_8_6_SOURCE_MATERIALIZATION_RECEIPT',
              'scientific_protocol_changed': False,
              'transport_successor': 'EXACT_GIT_BLOB_WITH_GIT_OBJECT_SIZE_AUTHORITY',
              'superseded_external_fault_size': 40528226,
              'authoritative_fault_blob_bytes': 10622730,
              'core': core,
              'overlay': overlay,
              'overlay_members': expected,
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'gate', 'SOURCE_MATERIALIZATION_RECEIPT_V0_8_6.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

          sha256sum -c BUNDLE_SOURCE_SHA256SUMS.txt
          python -m py_compile /tmp/v086/*.py

          python -m pip download --only-binary=:all: --dest "$WHEELHOUSE" \
            'numpy==2.1.3' 'pyproj==3.7.0' 'shapely==2.0.6'
          (cd "$WHEELHOUSE" && sha256sum * | LC_ALL=C sort) > "$GATE/PYTHON_WHEELHOUSE_SHA256.txt"
          python -m pip install --no-index --find-links "$WHEELHOUSE" \
            'numpy==2.1.3' 'pyproj==3.7.0' 'shapely==2.0.6'
          python -m pip freeze --all | LC_ALL=C sort > "$GATE/PYTHON_ENVIRONMENT_FREEZE.txt"

          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          import numpy, pyproj, shapely
          p = Path('spec/v0_8/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json')
          raw = p.read_bytes()
          obj = json.loads(raw)
          stripped = dict(obj)
          pid = stripped.pop('protocol_id')
          declared = stripped.pop('protocol_sha256')
          calculated = hashlib.sha256(
              json.dumps(stripped, ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          ).hexdigest()
          checks = {
              'content_address': pid == f'h8p:{calculated}' and declared == calculated,
              'status_locked': obj.get('status') == 'LOCKED_BEFORE_REAL_MECHANISM_ANGLE_ACCESS',
              'angle_firewall': obj.get('blind_eligibility', {}).get('angle_fields_sealed_until_selection_receipt') is True,
              'authority_none': obj.get('authority_ceiling') == 'NONE',
              'promotion_blocked': obj.get('promotion') == 'BLOCKED',
          }
          if not all(checks.values()):
              raise SystemExit(checks)
          audit = {
              'checks': checks,
              'protocol_id': pid,
              'protocol_content_sha256': calculated,
              'protocol_file_sha256': hashlib.sha256(raw).hexdigest(),
              'runtime': {
                  'python': sys.version,
                  'numpy': numpy.__version__,
                  'pyproj': pyproj.__version__,
                  'shapely': shapely.__version__,
              },
          }
          Path(os.environ['RUNNER_TEMP'], 'gate', 'PROTOCOL_AND_RUNTIME_AUDIT.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          PY

          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python /tmp/v086/MENDELEY_EXACT_BYTE_ACQUISITION_V0_8_6.py --output-dir "$ACQUIRED"
          acq_rc=$?
          set -e
          printf '%s\n' "$acq_rc" > "$GATE/ACQUISITION_EXIT_CODE.txt"
          [[ ! -f "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json" ]] || cp "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json" "$GATE/"
          if [[ "$acq_rc" -eq 3 ]]; then
            exit 0
          fi
          if [[ "$acq_rc" -ne 0 ]]; then
            exit "$acq_rc"
          fi

          mechanism_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["mechanism_receipt"]["sha256"])' "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json")
          transport/v0_8/RUN_HARDENED_PICKLE_EXTRACTION_V0_8.sh \
            --input "$ACQUIRED/focmec_ca_final.pickle" \
            --expected-sha256 "$mechanism_sha" \
            --output-dir "$BLIND"

          fault_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["fault_receipt"]["sha256"])' "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json")
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            python transport/v0_8/RUN_BLIND_ELIGIBILITY_SAFE_NPZ_V0_8.py \
              --protocol spec/v0_8/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json \
              --safe-npz "$BLIND/blind_columns.npz" \
              --extraction-receipt "$BLIND/EXTRACTION_RECEIPT_V0_8_SUCCESSOR.json" \
              --acquisition-receipt "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json" \
              --fault-geojson "$ACQUIRED/gem_active_faults_harmonized.geojson" \
              --fault-sha256 "$fault_sha" \
              --output "$GATE/BLIND_ELIGIBILITY_RESULT_V0_8.json"
          eligibility_rc=$?
          set -e
          printf '%s\n' "$eligibility_rc" > "$GATE/ELIGIBILITY_EXIT_CODE.txt"
          if [[ "$eligibility_rc" -ne 0 && "$eligibility_rc" -ne 3 ]]; then
            exit "$eligibility_rc"
          fi

          cp "$ACQUIRED/ACQUISITION_RECEIPT_V0_8_6.json" "$GATE/"
          cp "$ACQUIRED/MENDELEY_PUBLIC_FILES_V2.json" "$GATE/"
          cp "$ACQUIRED/gem_active_faults_harmonized.geojson" "$GATE/"
          cp "$BLIND/blind_columns.npz" "$GATE/"
          cp "$BLIND/EXTRACTION_RECEIPT_V0_8_SUCCESSOR.json" "$GATE/"
          cp "$BLIND/SANDBOX_EXECUTION_RECEIPT_V0_8.json" "$GATE/"
          cp "$BLIND/SAFE_NPZ_VERIFICATION_RECEIPT_V0_8.json" "$GATE/"
          cp spec/v0_8/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json "$GATE/"

          python /tmp/v086/BUILD_REMOTE_GATE_RECEIPT_V0_8_6.py \
            --artifact-dir "$GATE" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --eligibility-exit-code "$eligibility_rc"

      - name: Upload governed blind-gate artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helical-v08-6-blind-gate
          path: ${{ runner.temp }}/gate
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
