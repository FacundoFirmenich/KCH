name: KCH Helical v0.14 historical runtime introspection

on:
  push:
    branches:
      - helical-v014-calibration-runtime-qualification-20261011
    paths:
      - ".github/workflows/helical-v014-runtime-source-introspection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kch-helical-v014-runtime-introspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct-and-audit-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HISTORICAL_COMMIT: e458afe20b8172db5a04194224cf21df5ec00dc4
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v014-calibration-runtime-qualification-20261011
          fetch-depth: 0

      - name: Install Python 3.11 and pinned audit dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install runtime test stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 scipy==1.14.1 pytest==8.3.3

      - name: Reconstruct exact v0.8.4 source archive from Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v014-introspection"
          python - <<'PY'
          from __future__ import annotations
          import ast, base64, gzip, hashlib, io, json, os, pathlib, shutil, subprocess, tarfile, zipfile
          from pathlib import Path, PurePosixPath

          commit=os.environ['HISTORICAL_COMMIT']
          workspace=Path(os.environ['GITHUB_WORKSPACE'])
          root=Path(os.environ['RUNNER_TEMP'])/'v014-introspection'
          source=root/'runtime_source'
          chunks={
            '.github/helical_v08_4/source_transport/chunk_00':('da9a691447b022087063b132a03ad1d4399cadd1',15853),
            '.github/helical_v08_4/source_transport/chunk_01':('3082e6ee37ad74319195d37dea59d495fe90f490',16000),
            '.github/helical_v08_4/source_transport/chunk_02':('6449dfb0065b3fd8347cb83bb1b9f07236e6fb89',9756),
          }
          def git(*args: str)->bytes:
              return subprocess.check_output(['git','-C',str(workspace),*args])
          def sha(data: bytes)->str:
              return hashlib.sha256(data).hexdigest()
          def safe_name(name: str)->bool:
              p=PurePosixPath(name)
              return bool(name) and not p.is_absolute() and '..' not in p.parts
          git('cat-file','-e',f'{commit}^{{commit}}')
          source_parts=[]; source_receipts=[]
          for path,(blob,expected_size) in chunks.items():
              observed=git('rev-parse',f'{commit}:{path}').decode().strip()
              if observed != blob:
                  raise RuntimeError(f'blob mismatch {path}: {observed} != {blob}')
              data=git('show',f'{commit}:{path}')
              if len(data) != expected_size:
                  raise RuntimeError(f'byte-size mismatch {path}: {len(data)} != {expected_size}')
              source_parts.append(data)
              source_receipts.append({'path':path,'git_blob_sha1':observed,'bytes':len(data),'sha256':sha(data)})
          b64=b''.join(source_parts)
          compressed=base64.b64decode(b''.join(b64.split()),validate=True)
          payload=gzip.decompress(compressed)
          if source.exists(): shutil.rmtree(source)
          source.mkdir(parents=True)
          archive_type=None
          bio=io.BytesIO(payload)
          try:
              with tarfile.open(fileobj=bio,mode='r:*') as tf:
                  members=tf.getmembers()
                  if any(not safe_name(m.name) or m.issym() or m.islnk() for m in members):
                      raise RuntimeError('unsafe tar member')
                  tf.extractall(source,filter='data')
                  archive_type='tar'
          except tarfile.ReadError:
              bio.seek(0)
              if not zipfile.is_zipfile(bio):
                  raise RuntimeError('decoded payload is neither tar nor zip')
              bio.seek(0)
              with zipfile.ZipFile(bio) as zf:
                  if any(not safe_name(name) for name in zf.namelist()):
                      raise RuntimeError('unsafe zip member')
                  zf.extractall(source)
                  archive_type='zip'
          required=(
              'src/kch_helical_dynamic_v08/null_runtime.py',
              'tests_v0_8_4/test_null_runtime.py',
              'tools/freeze_null_perturbation_runtime.py',
          )
          required_receipts=[]
          for req in required:
              matches=[p for p in source.rglob(Path(req).name) if p.as_posix().endswith(req)]
              if len(matches)!=1:
                  raise RuntimeError(f'required source not uniquely found: {req}: {len(matches)}')
              p=matches[0]
              required_receipts.append({'required_path':req,'path':p.relative_to(source).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())})
          manifest=[]; api=[]
          for p in sorted(x for x in source.rglob('*') if x.is_file()):
              body=p.read_bytes(); rel=p.relative_to(source).as_posix()
              manifest.append({'path':rel,'bytes':len(body),'sha256':sha(body)})
              if p.suffix=='.py':
                  try:
                      tree=ast.parse(body.decode('utf-8'),filename=rel)
                      for node in tree.body:
                          if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                              api.append({'path':rel,'kind':'function','name':node.name,'line':node.lineno,'args':[a.arg for a in node.args.args]})
                          elif isinstance(node,ast.ClassDef):
                              api.append({'path':rel,'kind':'class','name':node.name,'line':node.lineno})
                  except Exception as exc:
                      api.append({'path':rel,'kind':'parse_error','name':type(exc).__name__,'line':None})
          receipt={
              'format':'KCH_HELICAL_V0_14_HISTORICAL_RUNTIME_SOURCE_INTROSPECTION_RECEIPT',
              'source_commit':commit,
              'source_chunks':source_receipts,
              'concatenated_base64_sha256':sha(b64),
              'compressed_sha256':sha(compressed),
              'decoded_archive_sha256':sha(payload),
              'archive_type':archive_type,
              'required_files':required_receipts,
              'manifest':manifest,
              'file_count':len(manifest),
              'api_entry_count':len(api),
              'scientific_execution_performed':False,
              'sealed_test_accessed':False,
              'authority':'SOFTWARE_CANDIDATE_LOCAL_SHADOW',
          }
          receipt['receipt_id']='h14source:'+sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'SOURCE_RECONSTRUCTION_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'API_INDEX.json').write_text(json.dumps(api,indent=2,sort_keys=True)+'\n')
          (root/'SOURCE_MANIFEST.json').write_text(json.dumps({'files':manifest},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'receipt_id':receipt['receipt_id'],'archive_type':archive_type,'file_count':len(manifest),'api_entry_count':len(api)},sort_keys=True))
          PY

      - name: Compile source and execute historical null-runtime tests
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/v014-introspection/runtime_source"
          export PYTHONPATH="$SRC/src"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v014-introspection/pycache"
          find "$SRC" -type f -name '*.py' -print0 | xargs -0 python -m py_compile
          python -m pytest -q "$SRC/tests_v0_8_4/test_null_runtime.py" --junitxml="$RUNNER_TEMP/v014-introspection/JUNIT_NULL_RUNTIME.xml"

      - name: Seal introspection artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v014-introspection"
          find "$ROOT" -type f -not -path '*/pycache/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          rm -rf "$ROOT/pycache"

      - name: Upload reconstructed source and audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v014-historical-runtime-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v014-introspection
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
