name: KCH Mendeley route discovery v0.3
on:
  pull_request:
    paths:
      - "construct_successors/KCH_HELICAL_V09_REMOTE_GATE_20261009_R2/discover_route_v03.py"
      - ".github/workflows/kch-mendeley-route-discovery-v03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python construct_successors/KCH_HELICAL_V09_REMOTE_GATE_20261009_R2/discover_route_v03.py
      - run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf discovery-v03.tar.gz route-discovery
          sha256sum discovery-v03.tar.gz > discovery-v03.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-mendeley-route-discovery-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            discovery-v03.tar.gz
            discovery-v03.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
