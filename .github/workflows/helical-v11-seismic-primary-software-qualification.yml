name: Helical v1.1 terminal seismic software qualification

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/workflows/helical-v11-seismic-primary-software-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned scientific stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Build deterministic nonauthoritative runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qualification"
          mkdir -p "$out/input" "$out/result"
          python - <<'PY'
          import numpy as np, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'qualification'/'input'
          rng=np.random.default_rng(117711)
          per=400; n=800
          cohort=np.repeat(np.array([0,1],dtype=np.int8),per)
          split=np.tile(np.concatenate([np.zeros(200,dtype=np.int8),np.ones(100,dtype=np.int8),np.full(100,2,dtype=np.int8)]),2)
          time=np.concatenate([np.arange(per,dtype=float)*86400, np.arange(per,dtype=float)*86400+1e8])
          fault=np.concatenate([np.arange(per)%4, 10+np.arange(per)%3]).astype(int)
          tangent=np.zeros((n,3)); tangent[:,0]=1.0
          strike=rng.uniform(0,360,n); dip=rng.uniform(30,80,n); rake=rng.uniform(-180,180,n)
          def paxis(strike,dip,rake):
              s=np.deg2rad(strike); d=np.deg2rad(dip); r=np.deg2rad(rake)
              sv=np.stack([np.cos(s),np.sin(s),np.zeros_like(s)],axis=1)
              dd=np.stack([-np.sin(s)*np.cos(d),np.cos(s)*np.cos(d),np.sin(d)],axis=1)
              normal=np.cross(sv,dd); normal/=np.linalg.norm(normal,axis=1)[:,None]
              slip=np.cos(r)[:,None]*sv+np.sin(r)[:,None]*dd; slip/=np.linalg.norm(slip,axis=1)[:,None]
              axis=normal-slip; axis/=np.linalg.norm(axis,axis=1)[:,None]
              return axis
          axis=paxis(strike,dip,rake)
          down=np.array([0.,0.,1.]); e1=np.cross(np.broadcast_to(down,tangent.shape),tangent); e1/=np.linalg.norm(e1,axis=1)[:,None]
          e2=np.cross(tangent,e1); projection=np.sqrt((axis*e1).sum(1)**2+(axis*e2).sum(1)**2)
          observable=projection>=0.15
          starts=[0]; parents=[]; dts=[]; distances=[]; signs=[]; curv=[]
          for i in range(n):
              candidates=[]
              begin=0 if cohort[i]==0 else per
              for lag in range(1,6):
                  p=i-lag
                  if p>=begin and cohort[p]==cohort[i]: candidates.append(p)
              parents.extend(candidates); dts.extend([float(i-p) for p in candidates]); distances.extend([float(abs(i-p)) for p in candidates]); signs.extend([1.0]*len(candidates)); curv.extend([0.0]*len(candidates)); starts.append(len(parents))
          evid=np.array([f'fixture-{i:04d}' for i in range(n)])
          np.savez_compressed(root/'directional.npz',strike=strike,dip=dip,rake=rake,mag=rng.uniform(1,4,n),uncer=np.full(n,15.),year=np.full(n,2024),event_time_epoch=time,cohort_code=cohort,split_code=split,fault_assignment=fault,nearest_km=np.ones(n),second_km=np.full(n,3.),evid=evid,nodal_plane_equivalence=np.ones(n))
          np.savez_compressed(root/'preflight.npz',axis_observable=observable,projection_norm=projection,tangent_ned=tangent,along_fault_km=np.arange(n,dtype=float)%50,event_x=np.arange(n,dtype=float),event_y=np.zeros(n),candidate_starts=np.array(starts,dtype=np.int64),candidate_parent=np.array(parents,dtype=np.int64),candidate_dt_days=np.array(dts,dtype=float),candidate_distance_km=np.array(distances,dtype=float),candidate_sign=np.array(signs,dtype=float),candidate_curvature=np.array(curv,dtype=float))
          PY
      - name: Execute adjudicator and validate outputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qualification"
          python .github/helical_v11/seismic_terminal_primary_gate.py \
            --directional "$root/input/directional.npz" \
            --preflight "$root/input/preflight.npz" \
            --protocol .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json \
            --out "$root/result" > "$root/result/STDOUT.log"
          jq -e '.scientific_model_execution_performed? // true' "$root/result/SEISMIC_TERMINAL_FULL_NETWORK_PRIMARY_RESULT_V1_1.json" >/dev/null
          test -s "$root/result/SEISMIC_TERMINAL_CALIBRATION_GRID_V1_1.csv"
          test -s "$root/result/SEISMIC_TERMINAL_CALIBRATION_FREEZE_V1_1.json"
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt"
      - name: Upload zero-authority qualification
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-primary-software-qualification
          path: ${{ runner.temp }}/qualification
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
