name: Helical v0.8 ComCat location-uncertainty crosswalk

on:
  push:
    branches:
      - gate/helical-v08-dynamic-confirmatory-20260927
    paths:
      - .github/workflows/helical-v08-comcat-location-crosswalk.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned NumPy
        run: python -m pip install 'numpy==2.1.3'
      - name: Recover immutable selected-directional artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10934329977'
          EXPECTED_ARTIFACT_SHA256: 'ba2858030909b02c83ae107b062cce705bf6f485834c3e556c328dcd8d81e066'
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/input.zip"; input="$RUNNER_TEMP/input"
          curl --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$zip"
          test "$(sha256sum "$zip"|awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA256"
          mkdir -p "$input"; unzip -q "$zip" -d "$input"
      - name: Crosswalk selected events to ComCat preferred-origin uncertainty
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find "$RUNNER_TEMP/input" -name selected_directional_columns.npz -print -quit)
          test -n "$selected"
          mkdir -p "$RUNNER_TEMP/crosswalk"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_v08/comcat_location_uncertainty_crosswalk.py \
            --selected-npz "$selected" --out "$RUNNER_TEMP/crosswalk" \
            | tee "$RUNNER_TEMP/crosswalk/STDOUT.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          echo "$rc" > "$RUNNER_TEMP/crosswalk/RETURN_CODE.txt"
          find "$RUNNER_TEMP/crosswalk" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/crosswalk/SHA256SUMS.txt"
      - name: Upload material gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v08-comcat-location-crosswalk
          path: ${{ runner.temp }}/crosswalk
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
