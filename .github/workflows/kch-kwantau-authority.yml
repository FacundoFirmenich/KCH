name: KCH KwanTau Authority Broker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/kch-kwantau-authority/**'
      - '.github/workflows/kch-kwantau-authority.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install broker
        working-directory: integrations/kch-kwantau-authority
        run: python -m pip install -e .
      - name: Compile
        working-directory: integrations/kch-kwantau-authority
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        working-directory: integrations/kch-kwantau-authority
        run: python -B -m unittest discover -s tests -v
