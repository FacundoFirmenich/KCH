name: Helical v1.1 selected post-2021 directional acquisition

on:
  push:
    branches:
      - gate/helical-v10-mhd-census-seismic-post2021-review-20261011
    paths:
      - .github/helical_v10/seismic_selected_directional_acquire.py
      - .github/workflows/helical-v11-seismic-directional-acquire.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned acquisition dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pandas==2.2.3' 'requests==2.32.3'
      - name: Recover sealed blind fault-assignment artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/seismic_fault_preflight"
          mkdir -p "$in"
          gh run download 38145986840             --repo "$GITHUB_REPOSITORY"             --name kch-helical-v10-seismic-fault-preflight-v2             --dir "$in"
      - name: Acquire directional products only after full-network graph freeze
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/seismic_directional"
          mkdir -p "$out"
          PYTHONUNBUFFERED=1 python .github/helical_v10/seismic_selected_directional_acquire.py             --preflight-root "$RUNNER_TEMP/seismic_fault_preflight"             --out "$out" | tee "$out/EXECUTION_STDOUT.log"
      - name: Upload exact selected directional artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-selected-directional
          path: ${{ runner.temp }}/seismic_directional
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
