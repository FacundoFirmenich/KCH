name: KCH exact planning and local solar continuity
on:
  push:
    branches:
      - continuity/helical-planning-local-20261013
    paths:
      - research/continuity_v3_20261013/**
      - .github/workflows/helical-planning-continuity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install sole numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Verify all certificates and unchanged source evidence
        shell: bash
        run: |
          set -euo pipefail
          task_root=research/continuity_v3_20261013
          old_ech=research/continuity_v2_20261013/evidence/ech
          mkdir -p "$RUNNER_TEMP/kch-v3"
          cp -a "$old_ech" "$RUNNER_TEMP/kch-v3/ech-original"
          cp -a "$task_root/evidence/ech_joint" "$RUNNER_TEMP/kch-v3/ech-joint"
          cp -a "$task_root/evidence/solar_local" "$RUNNER_TEMP/kch-v3/solar-local"
          python "$old_ech/tools/check_ech_certificates.py" --inputs "$old_ech/inputs" --results "$RUNNER_TEMP/kch-v3/ech-original/results"
          python "$task_root/evidence/ech_joint/check_joint_certificates.py" --source "$old_ech" --results "$RUNNER_TEMP/kch-v3/ech-joint" --catalog "$RUNNER_TEMP/kch-v3/ech-joint/LOCAL_MINIMUM_LOOKAHEAD_CATALOG.json"
          python "$task_root/evidence/ech_joint/check_posthoc_local_ties.py" --source "$old_ech" --results "$RUNNER_TEMP/kch-v3/ech-joint"
          python "$task_root/evidence/solar_local/verify_solar_local.py" --repo . --diagnostic "$RUNNER_TEMP/kch-v3/solar-local"
          python "$task_root/evidence/quotient/verify_planning_quotient.py" --ech "$old_ech" --out "$RUNNER_TEMP/kch-v3/quotient"
          cmp "$task_root/evidence/quotient/results/PLANNING_PATTERN_PARTITION.json" "$RUNNER_TEMP/kch-v3/quotient/PLANNING_PATTERN_PARTITION.json"
          python "$task_root/tools/verify_continuity_v3.py"
      - name: Upload fresh verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-continuity-v3-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kch-v3/ech-original/results/SOLVER_FREE_CERTIFICATE_CHECK.json
            ${{ runner.temp }}/kch-v3/ech-joint/SOLVER_FREE_JOINT_CHECK.json
            ${{ runner.temp }}/kch-v3/ech-joint/SOLVER_FREE_POSTHOC_TIE_CHECK.json
            ${{ runner.temp }}/kch-v3/solar-local/SOLAR_LOCAL_VERIFICATION.json
            ${{ runner.temp }}/kch-v3/quotient/PLANNING_QUOTIENT_VERIFICATION.json
            research/continuity_v3_20261013/CORPUS_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
