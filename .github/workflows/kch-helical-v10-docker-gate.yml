name: KCH Helical v0.10.1 Docker exact-byte gate

on:
  push:
    branches: [helical-v09-remote-gate-20261009]
    paths: [".github/workflows/kch-helical-v10-docker-gate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kch-helical-v10-docker-gate
  cancel-in-progress: false

jobs:
  exact-byte-to-blind:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      CAPSULE_PARTS_DIR: construct_successors/helical_v10_capsule_parts
      CAPSULE_B64_BYTES: "38012"
      CAPSULE_B64_SHA256: 8c0dc5431526dea38b6293df89bba490827d7ebba38d9401d5e1c4cd3b2c22fe
      CAPSULE_ARCHIVE_SHA256: 111be417871ee951e8487f35e29a5d99c328a1a9ae3951ba5534d8adb846dc27
      ACQUISITION_PATCH_PARTS_DIR: construct_successors/helical_v10_acquisition_patch
      ACQUISITION_PATCH_SHA256: 970718c772bbccf33ddd8780f833309dba7d42f62f7e4c0aaaefa1657aefc536
      ACQUISITION_PREDECESSOR_SHA256: c42c5df08bea3e6c28da1b452b4bac559cb67eeea659a7212d24ddda680a5ba8
      ACQUISITION_SUCCESSOR_SHA256: bd59aa32c8455818c42d9559a1102c417e673b6758bfb85262d6f070703db66e
      SANDBOX_OVERLAY_PATH: construct_successors/helical_v10_sandbox_overlay/RUN_HARDENED_PICKLE_EXTRACTION_V0_10_1_DOCKER.sh
      SANDBOX_OVERLAY_SHA256: 92c2acc07d27685371ae10ec656bc644d15d16a50b28a1e9ed2b5386fd7f5e98
      SANDBOX_PREDECESSOR_SHA256: 5b62649d88992f7f866b5b577e08d5d7c0a810fa334ca4ffe2b9d57ef9959060
      SANDBOX_BASE_REPO_DIGEST: python@sha256:0dd364ba7e10242f07755449e3a3d0e35f9efd987952737b90def6709ab0c5ce
      SANDBOX_BASE_IMAGE_ID: sha256:541096ae9b05d3b850341b78790e2ed31e94d5aa0ea086933c6ff0c09ffa2e63
      NUMPY_WHEEL_FILENAME: numpy-2.1.3-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
      NUMPY_WHEEL_SHA256: bc6f24b3d1ecc1eebfbf5d6051faa49af40b03be1aaa781ebdadcbc090b4539b
      SANDBOX_ENV_FREEZE_RECEIPT_ID: h10sandboxenv:925e238a037845955341daf7e0d91ae9708df434cd43389a7e7c508bc31c7840
      SANDBOX_ENV_FREEZE_RECEIPT_SHA256: 2ac3bde51cf7cd982adaa6c846bf30202f4a1a9441cf8ea99c6e945d2ed6e116
      PREPARE_SCRIPT_SHA256: e0230fb057d0745a85a0e294941847fa0c9c0442c9c828a247707fd921db9e33
      BUILD_SCRIPT_SHA256: ac4ee30f8fc30f141bd38d9a6fb1bb2a4eca642c9cf4b663ed93ea7821b594f6
      TEST_SCRIPT_GIT_BLOB: bcb34597268b61e5e4e9c2bea316ed4c7c151595
      PURGE_SCRIPT_SHA256: adf23fbac87d6961ff93f72bc5cb818fb0e596bdcc1c45859de828f15ccce282

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify orchestration scripts and initialize successor lineage
        shell: bash
        run: |
          set -euo pipefail
          dir=construct_successors/helical_v10_remote_gate
          test "$(sha256sum "$dir/PREPARE_HELICAL_V10_CAPSULE.sh" | awk '{print $1}')" = "$PREPARE_SCRIPT_SHA256"
          test "$(sha256sum "$dir/BUILD_HELICAL_V10_SANDBOX_IMAGE.sh" | awk '{print $1}')" = "$BUILD_SCRIPT_SHA256"
          test "$(git hash-object "$dir/TEST_HELICAL_V10_1_DOCKER_SANDBOX.sh")" = "$TEST_SCRIPT_GIT_BLOB"
          test "$(sha256sum "$dir/PURGE_ARCHIVE_HELICAL_V10.sh" | awk '{print $1}')" = "$PURGE_SCRIPT_SHA256"
          bash -n "$dir"/*.sh
          mkdir -p "$RUNNER_TEMP/helical-v10/receipts"
          python - <<'PY'
          import json, os, pathlib
          body={
            "format":"KCH_HELICAL_V0_10_DOCKER_SANDBOX_SUCCESSOR_LINEAGE",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "predecessor_runs":[37884208343,37884594350,37885282638,37886081459,37886251723,37886441008],
            "predecessor_gate_receipt":"h9gate:34c98fad5e90688356b318b29823abc41e66cd0173695ce1105ef5dd4c34b854",
            "predecessors_mutated":False,
            "scientific_protocol_mutated":False,
            "directional_fields_unsealed":False,
            "authority_ceiling":"NONE",
            "promotion":"BLOCKED"
          }
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"helical-v10/receipts/SUCCESSOR_LINEAGE.json"
          p.write_text(json.dumps(body,sort_keys=True,indent=2)+"\n")
          PY

      - name: Prepare content-addressed capsule and successors
        id: prepare
        shell: bash
        run: |
          bash construct_successors/helical_v10_remote_gate/PREPARE_HELICAL_V10_CAPSULE.sh \
            --github-output "$GITHUB_OUTPUT" --receipts "$RUNNER_TEMP/helical-v10/receipts"

      - name: Install frozen host runtime dependencies
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$CAPSULE_ROOT/requirements-runtime.txt"
          python -m pip freeze --all | LC_ALL=C sort > "$RUNNER_TEMP/helical-v10/receipts/HOST_PIP_FREEZE.txt"

      - name: Build immutable networkless sandbox image
        id: image
        shell: bash
        run: |
          bash construct_successors/helical_v10_remote_gate/BUILD_HELICAL_V10_SANDBOX_IMAGE.sh \
            --github-output "$GITHUB_OUTPUT" --receipts "$RUNNER_TEMP/helical-v10/receipts"

      - name: Verify frozen invariants and effect-free dry-run
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$CAPSULE_ROOT/runtime/ACQUIRE_EXACT_SOURCES_V0_9.py" | awk '{print $1}')" = "$ACQUISITION_SUCCESSOR_SHA256"
          test "$(sha256sum "$CAPSULE_ROOT/runtime/RUN_HARDENED_PICKLE_EXTRACTION_V0_9.sh" | awk '{print $1}')" = "$SANDBOX_OVERLAY_SHA256"
          python -m compileall -q "$CAPSULE_ROOT/runtime"
          test "$(grep -Rho 'pickle\.load' "$CAPSULE_ROOT/runtime" | wc -l)" -eq 1
          ! grep -R 'from \.core' "$CAPSULE_ROOT/runtime/kch_helical_dynamic_v08/eligibility.py"
          ! grep -R 'scipy' "$CAPSULE_ROOT/runtime/kch_helical_dynamic_v08/eligibility.py"
          set +e
          python "$CAPSULE_ROOT/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py" --workspace "$RUNNER_TEMP/helical-v10-dry-run"
          rc=$?
          set -e
          test "$rc" -eq 4
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"helical-v10-dry-run/receipts"
          gate=json.loads((root/"GATE_EXECUTION_RECEIPT_V0_9.json").read_text())
          attempt=json.loads((root/"ACQUISITION_ATTEMPT_V0_9.json").read_text())
          assert gate["outcome"]=="DRY_RUN_NO_EFFECT"
          assert gate["directional_fields_unsealed"] is False
          assert gate["model_fitting_performed"] is False
          assert attempt["format"]=="KCH_HELICAL_V0_10_PUBLIC_ROUTE_TRANSACTIONAL_EXACT_BYTE_ACQUISITION"
          PY

      - name: Execute adversarial sandbox battery
        shell: bash
        run: |
          bash construct_successors/helical_v10_remote_gate/TEST_HELICAL_V10_1_DOCKER_SANDBOX.sh \
            --capsule-root "${{ steps.prepare.outputs.root }}" \
            --image-id "${{ steps.image.outputs.image_id }}" \
            --image-receipt-sha "${{ steps.image.outputs.receipt_sha }}" \
            --receipts "$RUNNER_TEMP/helical-v10/receipts"

      - name: Execute exact-byte acquisition, Docker extraction, and blind eligibility
        id: gate
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.prepare.outputs.root }}
          KCH_DOCKER_SANDBOX_IMAGE: ${{ steps.image.outputs.image_id }}
          KCH_DOCKER_SANDBOX_IMAGE_REPO_DIGEST: ${{ env.SANDBOX_BASE_REPO_DIGEST }}
          KCH_DOCKER_SANDBOX_ENV_RECEIPT_SHA256: ${{ steps.image.outputs.receipt_sha }}
        run: |
          set +e
          python "$CAPSULE_ROOT/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py" \
            --workspace "$RUNNER_TEMP/helical-v10" --execute-network \
            --network-timeout-seconds 600 --sandbox-timeout-seconds 5400 \
            --sandbox-memory-mib 8192 --purge-raw-after-gate
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/helical-v10/receipts/GATE_EXIT_CODE.txt"
          echo "gate_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Purge raw bytes and build deterministic evidence archive
        if: always()
        shell: bash
        run: |
          bash construct_successors/helical_v10_remote_gate/PURGE_ARCHIVE_HELICAL_V10.sh \
            --workspace "$RUNNER_TEMP/helical-v10"

      - name: Upload receipts and safe derived artifacts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v10-docker-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/helical-v10/helical-v10-result-without-raw-sources.tar.gz
            ${{ runner.temp }}/helical-v10/helical-v10-result-without-raw-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Adjudicate only after evidence upload
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.gate_exit_code }}
        run: |
          set -euo pipefail
          case "${GATE_EXIT_CODE:-99}" in
            0) echo "ELIGIBILITY_PASS_DIRECTIONAL_UNSEAL_REQUEST_READY" ;;
            30) echo "LEGITIMATE_NOT_IDENTIFIABLE_MECHANISM_COVERAGE" ;;
            *) echo "Infrastructure or transport gate failed with exit ${GATE_EXIT_CODE:-99}" >&2; exit "${GATE_EXIT_CODE:-99}" ;;
          esac