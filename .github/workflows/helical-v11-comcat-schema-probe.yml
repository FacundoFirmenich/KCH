name: Helical v1.1 ComCat directional schema probe

on:
  push:
    branches:
      - gate/helical-v10-mhd-census-seismic-post2021-review-20261011
    paths:
      - .github/workflows/helical-v11-comcat-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query one already-selected event after graph freeze
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          curl --fail-with-body --location             'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&eventid=nc73671846'             -o "$out/event.geojson"
          jq '{id:.id,product_types:(.properties.products|keys),focal_mechanism:(.properties.products["focal-mechanism"]//[]|map({preferredWeight,updateTime,properties}))}' "$out/event.geojson" > "$out/schema.json"
          sha256sum "$out"/* > "$out/SHA256SUMS.txt"
          cat "$out/schema.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-comcat-schema-probe
          path: ${{ runner.temp }}/probe
          retention-days: 3
          compression-level: 0
