name: KCH Helical v0.14 runtime source bootstrap

on:
  push:
    branches:
      - helical-v014-calibration-runtime-qualification-20261010
    paths:
      - "construct_successors/KCH_HELICAL_V014_CALIBRATION_RUNTIME_QUALIFICATION_20261010/bootstrap/reconstruct_historical_v084_source.py"
      - ".github/workflows/helical-v014-runtime-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v014-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct-and-freeze-runtime-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROOT: construct_successors/KCH_HELICAL_V014_CALIBRATION_RUNTIME_QUALIFICATION_20261010
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout finite successor branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v014-calibration-runtime-qualification-20261010
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Reconstruct exact historical v0.8.4 runtime source
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/bootstrap/reconstruct_historical_v084_source.py" \
            --repo-root . \
            --output "$ROOT/reconstructed_v084" \
            --receipt "$ROOT/receipts/HISTORICAL_V084_SOURCE_RECONSTRUCTION_RECEIPT_V0_14.json"
          python -m py_compile \
            "$ROOT/reconstructed_v084/src/kch_helical_dynamic_v08/null_runtime.py" \
            "$ROOT/reconstructed_v084/tests_v0_8_4/test_null_runtime.py" \
            "$ROOT/reconstructed_v084/tools/freeze_null_perturbation_runtime.py"
          find "$ROOT/reconstructed_v084" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$ROOT/receipts/RECONSTRUCTED_V084_SHA256SUMS.txt"

      - name: Persist code-only reconstruction append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v014-bootstrap"
          git config user.email "kch-helical-v014-bootstrap@users.noreply.github.com"
          git add "$ROOT/reconstructed_v084" "$ROOT/receipts"
          if git diff --cached --quiet; then
            echo "No reconstruction delta"
          else
            git commit -m "record exact v0.8.4 null runtime source for v0.14 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload reconstruction receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v014-runtime-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROOT }}/receipts/HISTORICAL_V084_SOURCE_RECONSTRUCTION_RECEIPT_V0_14.json
            ${{ env.ROOT }}/receipts/RECONSTRUCTED_V084_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
