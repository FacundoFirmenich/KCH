name: Helical v1.0 MHD monthly-resume census and power

on:
  push:
    branches:
      - gate/helical-v10-mhd-census-seismic-post2021-review-20261011
    paths:
      - .github/helical_v10/mhd_solar_census_monthly_resume.py
      - .github/workflows/helical-v10-mhd-census-resume.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned census dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'drms==0.9.0' 'numpy==2.1.3' 'pandas==2.2.3' 'requests==2.32.3'
      - name: Recover exact predecessor partial census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/helical_v10_mhd"
          mkdir -p "$out"
          gh run download 38145217252 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v10-mhd-census \
            --dir "$out"
      - name: Resume JSOC by monthly chunks and complete unchanged census
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/helical_v10_mhd"
          PYTHONUNBUFFERED=1 python .github/helical_v10/mhd_solar_census_monthly_resume.py \
            --base-script .github/helical_v10/mhd_solar_census.py \
            --out "$out" | tee "$out/EXECUTION_RESUME_STDOUT.log"
          rm -f "$out/SHA256SUMS.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload completed MHD census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v10-mhd-census-complete
          path: ${{ runner.temp }}/helical_v10_mhd
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
