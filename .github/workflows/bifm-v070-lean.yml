name: BIFM v0.7 independent Lean proof core

on:
  push:
    branches:
      - bifm/v0.7.0-alpha0-independent-proof-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/bifm/v0.7.0-alpha0/lean
          auto-config: false
          build: false
          test: false
          lint: false
          nanoda: false
      - name: Create Lake manifest
        working-directory: research/bifm/v0.7.0-alpha0/lean
        run: lake update
      - name: Build proofs with Lean kernel
        working-directory: research/bifm/v0.7.0-alpha0/lean
        run: lake build
      - name: Reject sorry placeholders
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' research/bifm/v0.7.0-alpha0/lean/BIFM; then
            echo "Found forbidden proof placeholder"
            exit 1
          fi
