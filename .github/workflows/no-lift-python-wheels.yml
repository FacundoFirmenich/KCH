name: NO-LIFT Python wheel ferry

on:
  push:
    branches: [tooling/no-lift-formal-assets-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download pinned replay wheels
        run: |
          set -euxo pipefail
          python -m pip download --only-binary=:all: --dest wheels \
            'transformers==4.57.6' \
            'tokenizers==0.22.2' \
            'pyarrow==21.0.0' \
            'accelerate==1.11.0'
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          rows=[]
          for p in sorted(Path('wheels').glob('*')):
              rows.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('WHEEL_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum wheels/* > WHEELS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: no-lift-python313-replay-wheels
          path: |
            wheels/
            WHEEL_MANIFEST.json
            WHEELS.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
