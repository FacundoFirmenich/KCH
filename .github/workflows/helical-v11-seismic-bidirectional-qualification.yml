name: Helical v1.1 terminal seismic bidirectional qualification

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/helical_v11/qualify_terminal_positive.py
      - .github/workflows/helical-v11-seismic-bidirectional-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned scientific stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Demonstrate null rejection and strong-signal detection
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bidirectional_qualification"
          mkdir -p "$out"
          set +e
          python .github/helical_v11/qualify_terminal_positive.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$out" 2>&1 | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/EXIT_CODE.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
          exit "$rc"
      - name: Upload zero-authority bidirectional qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-bidirectional-qualification
          path: ${{ runner.temp }}/bidirectional_qualification
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
