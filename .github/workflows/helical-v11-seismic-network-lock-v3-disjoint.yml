name: Helical v1.1 disjoint blind full-network lock

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/helical_v11/run_network_lock_disjoint.py
      - .github/workflows/helical-v11-seismic-network-lock-v3-disjoint.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned network stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'networkx==3.4.2' 'pyproj==3.7.0' 'shapely==2.0.6'
      - name: Recover sealed blind preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seismic_preflight"
          gh run download 38145986840 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v10-seismic-fault-preflight-v2 \
            --dir "$RUNNER_TEMP/seismic_preflight"
      - name: Abstain overlapping events and recompute full network lock
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/seismic_network_lock"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_v11/run_network_lock_disjoint.py \
            --script .github/helical_v11/seismic_full_network_lock.py \
            --preflight-root "$RUNNER_TEMP/seismic_preflight" \
            --out "$out" 2>&1 | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload disjoint network lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-network-lock-v3-disjoint
          path: ${{ runner.temp }}/seismic_network_lock
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
