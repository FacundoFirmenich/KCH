name: KCH solar v1.6 metadata selected development
on:
  push:
    branches:
      - continuity/helical-metadata-successor-20261013
    paths:
      - .github/helical_v16/**
      - .github/workflows/helical-metadata-successor.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kch-solar-v16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT: /tmp/helical-v16
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned scientific stack and check frozen code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 scipy==1.14.1 astropy==7.1.0 drms==0.9.0 pandas==2.2.3 requests==2.32.3
          mkdir -p "$OUT"
          python -m pip freeze --all | LC_ALL=C sort > "$OUT/PIP_FREEZE.txt"
          python .github/helical_v16/run_successor.py check
          python -m py_compile .github/helical_v16/*.py
      - name: Select by metadata only
        id: select
        shell: bash
        run: |
          set +e
          python .github/helical_v16/select_metadata.py > "$OUT/METADATA_STDOUT.log" 2> "$OUT/METADATA_STDERR.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/METADATA_EXIT_CODE.txt"
          cat "$OUT/METADATA_STDOUT.log"
          cat "$OUT/METADATA_STDERR.log" >&2
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -ne 0 && "$rc" -ne 31 ]]; then exit "$rc"; fi
      - name: Freeze metadata artifact before any FITS body access
        id: metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solar-v16-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/helical-v16/metadata
            /tmp/helical-v16/METADATA_*.log
            /tmp/helical-v16/METADATA_EXIT_CODE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Execute once on frozen selected windows
        if: steps.select.outputs.exit_code == '0'
        env:
          METADATA_ARTIFACT_ID: ${{ steps.metadata.outputs.artifact-id }}
        shell: bash
        run: |
          set +e
          python .github/helical_v16/run_successor.py > "$OUT/STDOUT.log" 2> "$OUT/STDERR.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/EXIT_CODE.txt"
          cat "$OUT/STDOUT.log"
          cat "$OUT/STDERR.log" >&2
          if [[ "$rc" -ne 0 && "$rc" -ne 31 ]]; then exit "$rc"; fi
      - name: Purge guard
        if: always()
        shell: bash
        run: |
          if [[ -d "$OUT/raw" ]]; then rm -rf "$OUT/raw"; exit 91; fi
      - name: Upload safe receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solar-v16-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/helical-v16/safe
            /tmp/helical-v16/*.log
            /tmp/helical-v16/*EXIT_CODE.txt
            /tmp/helical-v16/PIP_FREEZE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Adjudicate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat "$OUT/METADATA_EXIT_CODE.txt")
          if [[ "$rc" -ne 0 ]]; then exit "$rc"; fi
          rc=$(cat "$OUT/EXIT_CODE.txt")
          if [[ "$rc" -ne 0 ]]; then exit "$rc"; fi
