name: Helical v0.6 locked local-piecewise gate v3

on:
  push:
    branches:
      - gate/helical-v06-local-piecewise-20260927
    paths:
      - .github/workflows/helical-v06-local-piecewise-gate-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned numerical packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scikit-learn==1.5.2'

      - name: Recover the one-byte transport defect against the locked chunk hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helical_v06_artifact"
          python .github/helical_v06_transport/repair_single_missing_base64_char.py \
            --input .github/helical_v06_bundle/chunk_01 \
            --receipt "$RUNNER_TEMP/helical_v06_artifact/TRANSPORT_REPAIR_RECEIPT.json"

      - name: Reconstruct lock, acquire exact bytes, and execute frozen gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python .github/helical_v06_transport/run_remote_v06.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/helical_v06_work" \
            --artifact-root "$RUNNER_TEMP/helical_v06_artifact"

      - name: Upload exact-byte v0.6 gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v06-local-piecewise-gate-v3
          path: ${{ runner.temp }}/helical_v06_artifact
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
