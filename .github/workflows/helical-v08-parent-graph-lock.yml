name: Helical v0.8 train-only ETAS Hawkes parent graph lock

on:
  push:
    branches:
      - gate/helical-v08-dynamic-confirmatory-20260927
    paths:
      - .github/workflows/helical-v08-parent-graph-lock.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned numerical and geometry stack
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'pyproj==3.7.0' 'shapely==2.0.6'
      - name: Recover immutable selected/preflight and topology/operator artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_artifact() {
            id="$1"; expected="$2"; dest="$3"
            zip="$RUNNER_TEMP/$id.zip"
            curl --fail-with-body --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" --output "$zip"
            test "$(sha256sum "$zip"|awk '{print $1}')" = "$expected"
            mkdir -p "$dest"; unzip -q "$zip" -d "$dest"
          }
          download_artifact 10934329977 ba2858030909b02c83ae107b062cce705bf6f485834c3e556c328dcd8d81e066 "$RUNNER_TEMP/selected"
          download_artifact 10936864363 d0134b482cd564afe465e2032c7e0661ab78b857f6d3848910c6c86e07127726 "$RUNNER_TEMP/topology"
      - name: Acquire pinned GEM fault network
        shell: bash
        run: |
          set -euo pipefail
          fault="$RUNNER_TEMP/gem_active_faults_harmonized.geojson"
          curl --fail-with-body --location \
            'https://raw.githubusercontent.com/GEMScienceTools/gem-global-active-faults/56816508ad92fd6846dad1163b1c8c01376a2cd1/geojson/gem_active_faults_harmonized.geojson' \
            --output "$fault"
          test "$(sha256sum "$fault"|awk '{print $1}')" = '37babb516edfac22b5ae91744495d8546b3ae4676b4d4f68cc77da8222df20e1'
      - name: Fit parent graph parameters on train only and diagnose on calibration only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parent_graph"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_v08/fit_parent_graph_lock.py \
            --selected-root "$RUNNER_TEMP/selected" \
            --topology-root "$RUNNER_TEMP/topology" \
            --fault-geojson "$RUNNER_TEMP/gem_active_faults_harmonized.geojson" \
            --out "$RUNNER_TEMP/parent_graph" | tee "$RUNNER_TEMP/parent_graph/STDOUT.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          echo "$rc" > "$RUNNER_TEMP/parent_graph/RETURN_CODE.txt"
          find "$RUNNER_TEMP/parent_graph" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/parent_graph/SHA256SUMS.txt"
      - name: Upload frozen parent-graph lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v08-parent-graph-lock
          path: ${{ runner.temp }}/parent_graph
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
