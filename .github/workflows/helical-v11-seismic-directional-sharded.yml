name: Helical v1.1 checkpointed directional acquisition

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/workflows/helical-v11-seismic-directional-sharded.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned acquisition stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'aiohttp==3.10.10' 'pandas==2.2.3'
      - name: Recover immutable disjoint network lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/network"
          gh run download 38165177631 --repo "$GITHUB_REPOSITORY" --name kch-helical-v11-seismic-network-lock-v3-disjoint --dir "$RUNNER_TEMP/network"
      - name: Acquire deterministic shard
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shard_${{ matrix.shard }}"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_v11/seismic_directional_shard.py \
            --base-script .github/helical_v11/seismic_directional_acquisition.py \
            --network-root "$RUNNER_TEMP/network" \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 4 \
            --out "$out" 2>&1 | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/EXIT_CODE.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
          exit "$rc"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-directional-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard_${{ matrix.shard }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned combination stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pandas==2.2.3'
      - name: Recover network lock and all shard checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/network" "$RUNNER_TEMP/shards"
          gh run download 38165177631 --repo "$GITHUB_REPOSITORY" --name kch-helical-v11-seismic-network-lock-v3-disjoint --dir "$RUNNER_TEMP/network"
      - uses: actions/download-artifact@v4
        with:
          pattern: kch-helical-v11-directional-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Combine only if every shard is complete
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/directional_combined"
          mkdir -p "$out"
          for shard in 0 1 2 3; do
            test "$(cat "$RUNNER_TEMP/shards/EXIT_CODE.txt" 2>/dev/null || true)" = 0 || true
            test -f "$RUNNER_TEMP/shards/SHARD_${shard}_MANIFEST.json"
            jq -e '.fetch_failures == 0' "$RUNNER_TEMP/shards/SHARD_${shard}_MANIFEST.json" >/dev/null
          done
          python .github/helical_v11/combine_directional_shards.py \
            --shards-root "$RUNNER_TEMP/shards" \
            --network-root "$RUNNER_TEMP/network" \
            --out "$out" \
            --source-run-id "$GITHUB_RUN_ID" | tee "$out/COMBINE_STDOUT.log"
          cp .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json "$out/"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload combined exact acquisition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-directional-acquisition-sharded
          path: ${{ runner.temp }}/directional_combined
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
