name: MHD001 exact NOAA annual blind label join v2

on:
  push:
    branches:
      - gate/mhd001-noaa-label-join-20261009
    paths:
      - .github/workflows/mhd001-noaa-blind-label-join-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-annual-label-join:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'astropy==7.0.0'

      - name: Recover immutable blind HARP census artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '11613151191'
          EXPECTED_SHA256: 'b188e420b95d01cff065532832c93535754de4160c49dd6dbdf0301f9eab6c31'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mhd001/census"
          archive="$RUNNER_TEMP/mhd001/census.zip"
          curl --silent --show-error --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d "$RUNNER_TEMP/mhd001/census"

      - name: Acquire exact annual NOAA NCEI flare-report entities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mhd001/noaa"
          annual="$root/annual"
          receipts="$root/receipts"
          mkdir -p "$annual" "$receipts"
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/multi/l2/data/xrsf-l2-flrpt_science/csv'
          for year in $(seq 2010 2025); do
            name="sci_xrsf-l2-flrpt_geo_y${year}_v1-0-1.csv"
            curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 300 --header 'Accept-Encoding: identity' \
              --dump-header "$receipts/${name}.headers" \
              --output "$annual/$name" \
              --write-out '%{json}' "$base/$name" > "$receipts/${name}.curl.json"
            test -s "$annual/$name"
          done
          metadata='sci_xrsf-l2-flrpt_geo_metadata.json'
          curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --header 'Accept-Encoding: identity' \
            --dump-header "$receipts/${metadata}.headers" \
            --output "$root/$metadata" \
            --write-out '%{json}' "$base/$metadata" > "$receipts/${metadata}.curl.json"
          test -s "$root/$metadata"
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$root/EXACT_SOURCE_SHA256SUMS.txt"

      - name: Deterministically combine annual bodies
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mhd001/noaa"
          python .github/helical_mhd001/combine_noaa_annual_flare_files.py \
            --source-dir "$root/annual" \
            --output-csv "$root/flare_2010_2025_combined.csv" \
            --output-manifest "$root/NOAA_ANNUAL_SOURCE_MANIFEST.json" \
            --years $(seq 2010 2025)

      - name: Execute the unchanged blind association and identifiability gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mhd001/result"
          root="$RUNNER_TEMP/mhd001/noaa"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_mhd001/noaa_blind_label_join.py \
            --protocol .github/helical_mhd001/MHD001_NOAA_LABEL_JOIN_LOCKED.json \
            --census-dir "$RUNNER_TEMP/mhd001/census" \
            --flare-csv "$root/flare_2010_2025_combined.csv" \
            --flare-metadata "$root/sci_xrsf-l2-flrpt_geo_metadata.json" \
            --metadata-curl-meta "$root/receipts/sci_xrsf-l2-flrpt_geo_metadata.json.curl.json" \
            --output-dir "$out" \
            | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          printf '%s\n' "$rc" > "$out/SCIENTIFIC_EXIT_CODE.txt"
          cp "$root/NOAA_ANNUAL_SOURCE_MANIFEST.json" "$out/"

      - name: Seal evidence tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/mhd001/artifact-v2"
          mkdir -p "$artifact"
          cp .github/helical_mhd001/MHD001_NOAA_LABEL_JOIN_LOCKED.json "$artifact/"
          cp .github/helical_mhd001/MHD001_NOAA_LABEL_SOURCE_RESOLUTION_V2.json "$artifact/"
          cp .github/helical_mhd001/MHD001_MODEL_GATE_LOCKED.json "$artifact/"
          cp .github/helical_mhd001/noaa_blind_label_join.py "$artifact/"
          cp .github/helical_mhd001/combine_noaa_annual_flare_files.py "$artifact/"
          if [ -d "$RUNNER_TEMP/mhd001/noaa" ]; then cp -a "$RUNNER_TEMP/mhd001/noaa" "$artifact/noaa_exact_sources"; fi
          if [ -d "$RUNNER_TEMP/mhd001/result" ]; then cp -a "$RUNNER_TEMP/mhd001/result" "$artifact/result"; fi
          if [ -f "$RUNNER_TEMP/mhd001/census/BLIND_HARP_CENSUS.json" ]; then
            mkdir -p "$artifact/census_receipts"
            cp "$RUNNER_TEMP/mhd001/census/BLIND_HARP_CENSUS.json" "$artifact/census_receipts/"
            cp "$RUNNER_TEMP/mhd001/census/BLIND_HARP_SUMMARY.csv" "$artifact/census_receipts/"
          fi
          cd "$artifact"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          find . -type f -print0 | sort -z | xargs -0 -n1 stat --printf='%n\t%s bytes\n' > FILE_SIZES.txt

      - name: Upload sealed annual-source label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-mhd001-noaa-annual-blind-label-join-v2
          path: ${{ runner.temp }}/mhd001/artifact-v2
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
