name: CFL G3.9 open grammar genesis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-g3-9:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r experiments/cfl_g3_9_open_grammar_genesis_20261001/requirements.txt
      - name: Materialize and verify runner
        run: |
          set -euo pipefail
          cp experiments/cfl_g3_9_open_grammar_genesis_20261001/run_g39.py.gz run_g39.py.gz
          echo "1c613d690c9bc19c28b192e00ac7620684ec822415dea1be3f4d765e4981db0e  run_g39.py.gz" | sha256sum -c -
          gzip -dc run_g39.py.gz > run_g39.py
          echo "4eabe1be85ae5f7136772a9d73a004babfe90b12055592444ce66fb09710eddc  run_g39.py" | sha256sum -c -
          python -m py_compile run_g39.py
      - name: Reproduce consumed private reserve only
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          G39_SPLIT: private
          G39_WORKDIR: ${{ github.workspace }}/g39_work
        run: |
          set -euo pipefail
          python run_g39.py 2>&1 | tee g39_stdout.log
          test -s g39_work/results/FINAL_ADJUDICATION.json
          test -s g39_work/results/METHOD_RESULTS.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CFL_G3_9_OPEN_GRAMMAR_${{ github.sha }}
          path: g39_work
          if-no-files-found: warn
          retention-days: 30
