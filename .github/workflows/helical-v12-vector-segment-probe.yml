name: Helical v1.2 direct vector-field segment probe

on:
  push:
    branches:
      - gate/helical-v10-mhd-census-seismic-post2021-review-20261011
    paths:
      - .github/helical_v12/vector_segment_probe.py
      - .github/workflows/helical-v12-vector-segment-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'drms==0.9.0' 'pandas==2.2.3' 'requests==2.32.3'
      - name: Query one development-only SHARP vector record
        shell: bash
        env:
          OUT: ${{ runner.temp }}/v12_vector_probe
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python .github/helical_v12/vector_segment_probe.py | tee "$OUT/STDOUT.log"
      - uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v12-vector-segment-probe
          path: ${{ runner.temp }}/v12_vector_probe
          retention-days: 3
          compression-level: 0
