name: Helical v1.2 direct vector-field segment probe

on:
  push:
    branches:
      - gate/helical-v12-theory-mhd-direct-field-20261012
    paths:
      - .github/helical_v12/vector_segment_probe.py
      - .github/workflows/helical-v12-vector-segment-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kch-helical-v12-vector-segment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact successor
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned probe dependencies
        run: python -m pip install 'drms==0.9.0' 'pandas==2.2.3' 'requests==2.32.3'
      - name: Query one development-only SHARP vector record
        shell: bash
        env:
          OUT: ${{ runner.temp }}/v12_vector_probe
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python .github/helical_v12/vector_segment_probe.py | tee "$OUT/STDOUT.log"
      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v12-vector-segment-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v12_vector_probe
          retention-days: 7
          compression-level: 0
