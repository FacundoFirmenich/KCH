name: Helical v1.1 terminal seismic full-network primary gate

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/helical_v11/TRIGGER_TERMINAL_SEISMIC_PRIMARY
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned scientific stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'networkx==3.4.2' 'pyproj==3.7.0' 'shapely==2.0.6'
      - name: Recover immutable network and complete directional artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/network" "$RUNNER_TEMP/directional" "$RUNNER_TEMP/terminal/source"
          gh run download 38165177631 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v11-seismic-network-lock-v3-disjoint \
            --dir "$RUNNER_TEMP/network"
          gh run download 38167438725 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v11-seismic-directional-acquisition-complete \
            --dir "$RUNNER_TEMP/directional"
          jq -e '.directional_acquisition_id == "s11dir:e22bb558ab385163211bb1b87e2d45cf9d98f1e638fcc9f183511bdf03779a72" and .directional_coverage_gate_pass == true and .fetch_failures == 0 and .selected_event_count == 5489' \
            "$RUNNER_TEMP/directional/SEISMIC_DIRECTIONAL_ACQUISITION_V1_1.json" >/dev/null
          echo '2246faf8d41a3a386539d7973180e6ac55c52fefbc80661135bf28046d5100f0  '"$RUNNER_TEMP/directional/SELECTED_DIRECTIONAL_MECHANISMS.csv.gz" | sha256sum -c -
          echo 'e6253256acf3ad016330b73f44f9cc1575aa43f47e674abd2774cb569ca416de  '"$RUNNER_TEMP/directional/COMCAT_DETAIL_BODIES.tar.gz" | sha256sum -c -
          curl --fail-with-body --location --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/GEMScienceTools/gem-global-active-faults/56816508ad92fd6846dad1163b1c8c01376a2cd1/geojson/gem_active_faults_harmonized.geojson' \
            --output "$RUNNER_TEMP/terminal/source/gem_active_faults_harmonized.geojson"
          echo '37babb516edfac22b5ae91744495d8546b3ae4676b4d4f68cc77da8222df20e1  '"$RUNNER_TEMP/terminal/source/gem_active_faults_harmonized.geojson" | sha256sum -c -
      - name: Materialize axial marks and ambiguity-filtered full-network candidates
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/terminal"
          PYTHONUNBUFFERED=1 python .github/helical_v11/run_terminal_prepare_with_path_ambiguity.py \
            --script .github/helical_v11/seismic_terminal_prepare.py \
            --network-root "$RUNNER_TEMP/network" \
            --directional-root "$RUNNER_TEMP/directional" \
            --fault-geojson "$out/source/gem_active_faults_harmonized.geojson" \
            --protocol .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json \
            --out "$out" | tee "$out/MATERIALIZATION_STDOUT.log"
      - name: Freeze calibration selection and open held-out test once
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/terminal"
          PYTHONUNBUFFERED=1 python .github/helical_v11/run_primary_gate_json_safe.py \
            --script .github/helical_v11/seismic_terminal_primary_gate.py \
            --directional "$out/SEISMIC_TERMINAL_DIRECTIONAL_V1_1.npz" \
            --preflight "$out/SEISMIC_TERMINAL_PREFLIGHT_V1_1.npz" \
            --protocol .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json \
            --out "$out" | tee "$out/PRIMARY_GATE_STDOUT.log"
          cp .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json "$out/"
          cp "$RUNNER_TEMP/network/SEISMIC_FULL_NETWORK_LOCK_V1_1.json" "$out/"
          cp "$RUNNER_TEMP/network/COHORT_OVERLAP_ABSTENTION_RECEIPT.json" "$out/"
          cp "$RUNNER_TEMP/directional/SEISMIC_DIRECTIONAL_ACQUISITION_V1_1.json" "$out/"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload sealed terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-terminal-primary
          path: ${{ runner.temp }}/terminal
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
