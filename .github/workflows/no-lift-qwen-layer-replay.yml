name: NO-LIFT Qwen layer replay

on:
  push:
    branches: [tooling/no-lift-formal-assets-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        layer: [4, 14, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned replay stack
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.10.0 transformers==4.57.6 tokenizers==0.22.2 \
            huggingface_hub==0.36.0 pandas==2.2.3 pyarrow==21.0.0 \
            numpy==2.3.5 accelerate==1.11.0 safetensors==0.7.0 sentencepiece==0.2.1
      - name: Execute all epsilons for layer ${{ matrix.layer }}
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python tooling/no_lift_qwen_layer_replay.py \
            --layer ${{ matrix.layer }} \
            --out replay_L${{ matrix.layer }} \
            --expected tooling/EXPECTED_QWEN_RAW_SHARDS.json \
            | tee replay_L${{ matrix.layer }}.log
          sha256sum replay_L${{ matrix.layer }}/* > replay_L${{ matrix.layer }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: no-lift-qwen-layer-${{ matrix.layer }}-replay
          path: |
            replay_L${{ matrix.layer }}/
            replay_L${{ matrix.layer }}.log
            replay_L${{ matrix.layer }}.sha256
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
