name: KCH Helical v0.14.3 FDSN CSV location-uncertainty gate

on:
  push:
    branches:
      - helical-v0143-csv-location-uncertainty-crosswalk-20261010
    paths:
      - "construct_successors/KCH_HELICAL_V0143_CSV_LOCATION_UNCERTAINTY_CROSSWALK_20261010/**"
      - ".github/workflows/helical-v0143-csv-location-uncertainty-crosswalk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0143-csv-crosswalk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-fdsn-csv-location-uncertainty-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      V10: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009
      V11: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009
      V14: construct_successors/KCH_HELICAL_V014_LOCATION_UNCERTAINTY_CROSSWALK_20261010
      V141: construct_successors/KCH_HELICAL_V0141_LOCATION_UNCERTAINTY_CROSSWALK_20261010
      V142: construct_successors/KCH_HELICAL_V0142_CSV_LOCATION_UNCERTAINTY_CROSSWALK_20261010
      ROOT: construct_successors/KCH_HELICAL_V0143_CSV_LOCATION_UNCERTAINTY_CROSSWALK_20261010
      PROTOCOL: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/protocol/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json
      ELIGIBILITY: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/results/run-37919577887-1/BLIND_ELIGIBILITY_RESULT_V0_10.json
      GEOJSON_RESULT: construct_successors/KCH_HELICAL_V0141_LOCATION_UNCERTAINTY_CROSSWALK_20261010/results/run-38001203493-1/COMCAT_LOCATION_UNCERTAINTY_GATE_RESULT_V0_14.json
      GEOJSON_RUN: construct_successors/KCH_HELICAL_V0141_LOCATION_UNCERTAINTY_CROSSWALK_20261010/results/run-38001203493-1/RUN_RECEIPT_V0_14.json
      FAILED_CSV_RUN: construct_successors/KCH_HELICAL_V0142_CSV_LOCATION_UNCERTAINTY_CROSSWALK_20261010/results/run-38001867357-1/RUN_RECEIPT_V0_14.json

    steps:
      - name: Checkout finite successor branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0143-csv-location-uncertainty-crosswalk-20261010
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned host geometry stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pyproj==3.7.0 shapely==2.0.6
          mkdir -p "$RUNNER_TEMP/helical-v0143/control"
          python -m pip freeze --all | LC_ALL=C sort > "$RUNNER_TEMP/helical-v0143/control/PIP_FREEZE.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'helical-v0143'/'control'
          freeze=(root/'PIP_FREEZE.txt').read_bytes()
          body={
            'python':sys.version,
            'platform':platform.platform(),
            'pip_freeze_sha256':hashlib.sha256(freeze).hexdigest(),
            'docker_version':subprocess.check_output(['docker','--version'],text=True).strip(),
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'github_sha':os.environ['GITHUB_SHA'],
            'github_ref':os.environ['GITHUB_REF'],
          }
          (root/'RUNTIME_ENVIRONMENT.json').write_text(json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY

      - name: Verify disjoint authority and immutable predecessor closures
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$ROOT/helical_v0143_location_uncertainty_gate.py" \
            "$V142/comcat_csv_location_uncertainty_crosswalk_v0142.py" \
            "$V14/helical_v014_location_uncertainty_gate.py" \
            "$V11/extract_blind_v011.py" \
            "$V11/helical_v011_directional_pretest.py" \
            "$V11/helical_v011_directional_pretest_core.py" \
            "$V10/helical_remote_gate.py" \
            "$V10/helical_public_acquisition.py" \
            "$V10/helical_geometry_adapter.py"
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_14_3.json" >/dev/null
          python -m json.tool "$GEOJSON_RESULT" >/dev/null
          python -m json.tool "$GEOJSON_RUN" >/dev/null
          python -m json.tool "$FAILED_CSV_RUN" >/dev/null
          python -m json.tool "$PROTOCOL" >/dev/null
          python -m json.tool "$ELIGIBILITY" >/dev/null
          python - "$ROOT/AUTHORITY_LEASE_V0_14_3.json" "$GEOJSON_RESULT" "$GEOJSON_RUN" "$FAILED_CSV_RUN" <<'PY'
          import json, sys
          lease=json.load(open(sys.argv[1])); geo=json.load(open(sys.argv[2])); geo_run=json.load(open(sys.argv[3])); failed=json.load(open(sys.argv[4]))
          assert geo['outcome']=='NOT_IDENTIFIABLE_LOCATION_UNCERTAINTY_COVERAGE'
          assert geo['gate_id']==lease['closed_geojson_gate_id']
          assert geo_run['run_receipt_id']==lease['closed_geojson_run_receipt_id']
          assert failed['outcome']=='FAIL_CLOSED'
          assert failed['authority_consumed'] is False
          assert failed['run_receipt_id']==lease['predecessor_failed_run_receipt_id']
          assert failed['sealed_test_accessed'] is False
          assert failed['scientific_model_execution_performed'] is False
          assert lease['scope']=='EXACT_COMCAT_CSV_LOCATION_UNCERTAINTY_CROSSWALK_ONLY'
          assert lease['observation_adapter_change']=='USGS_FDSN_GEOJSON_SUMMARY_TO_USGS_FDSN_CSV_BULK'
          assert lease['scientific_matching_contract_changed'] is False
          assert lease['coverage_threshold_changed'] is False
          assert lease['single_use'] is True
          PY
          sha256sum \
            "$ROOT/AUTHORITY_LEASE_V0_14_3.json" \
            "$ROOT/helical_v0143_location_uncertainty_gate.py" \
            "$V142/comcat_csv_location_uncertainty_crosswalk_v0142.py" \
            "$V14/helical_v014_location_uncertainty_gate.py" \
            "$GEOJSON_RESULT" \
            "$GEOJSON_RUN" \
            "$FAILED_CSV_RUN" \
            "$V11/extract_blind_v011.py" \
            "$V11/helical_v011_directional_pretest.py" \
            "$V11/helical_v011_directional_pretest_core.py" \
            "$V10/helical_remote_gate.py" \
            "$V10/helical_public_acquisition.py" \
            "$V10/helical_geometry_adapter.py" \
            "$PROTOCOL" \
            "$ELIGIBILITY" \
            > "$RUNNER_TEMP/helical-v0143/control/INPUT_SHA256SUMS.txt"

      - name: Freeze networkless blind-extraction image before source access
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/helical-v0143"
          image_context="$root/image"
          mkdir -p "$image_context"
          base="docker.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89"
          docker pull "$base"
          python -m pip download --only-binary=:all: --no-deps --dest "$image_context" numpy==2.1.3
          wheel=$(find "$image_context" -maxdepth 1 -name 'numpy-*.whl' -type f -print -quit)
          test -n "$wheel"
          cp "$V11/extract_blind_v011.py" "$image_context/extractor.py"
          wheel_name=$(basename "$wheel")
          cat > "$image_context/Dockerfile" <<EOF
          FROM $base
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
          COPY $wheel_name /wheels/$wheel_name
          RUN pip install --no-cache-dir --no-index /wheels/$wheel_name && rm -rf /wheels
          COPY extractor.py /app/extractor.py
          ENTRYPOINT ["python", "/app/extractor.py"]
          EOF
          docker build --pull=false --network=none -t kch-helical-v0143-blind:locked "$image_context"
          python - "$root/control/BLIND_IMAGE_LOCK_RECEIPT_V0_14_3.json" "$base" "$wheel" "$image_context" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, subprocess, sys
          output,base,wheel,context=Path(sys.argv[1]),sys.argv[2],Path(sys.argv[3]),Path(sys.argv[4])
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          body={
            'format':'KCH_HELICAL_V0_14_3_BLIND_IMAGE_LOCK_RECEIPT',
            'locked_before_source_access':True,
            'base_image_digest':base,
            'numpy_wheel_sha256':sha(wheel),
            'blind_extractor_sha256':sha(context/'extractor.py'),
            'dockerfile_sha256':sha(context/'Dockerfile'),
            'image_id':subprocess.check_output(['docker','image','inspect','--format','{{.Id}}','kch-helical-v0143-blind:locked'],text=True).strip(),
            'network_mode_at_extraction':'NONE',
            'root_filesystem_at_extraction':'READ_ONLY',
            'capabilities_at_extraction':'ALL_DROPPED',
            'no_new_privileges_at_extraction':True,
            'locked_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'authority_ceiling':'EXACT_COMCAT_CSV_LOCATION_UNCERTAINTY_CROSSWALK_ONLY',
          }
          body['receipt_id']='h143imagelock:'+hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          output.write_text(json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY
          rm -rf "$image_context"

      - name: Execute exact FDSN CSV uncertainty crosswalk successor
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/helical-v0143/work"
          PYTHONPATH="$GITHUB_WORKSPACE/$V10:$GITHUB_WORKSPACE/$V11:$GITHUB_WORKSPACE/$V14:$GITHUB_WORKSPACE/$V142:$GITHUB_WORKSPACE/$ROOT" \
          python "$ROOT/helical_v0143_location_uncertainty_gate.py" \
            --protocol "$PROTOCOL" \
            --authority "$ROOT/AUTHORITY_LEASE_V0_14_3.json" \
            --eligibility-result "$ELIGIBILITY" \
            --crosswalk-runtime "$V142/comcat_csv_location_uncertainty_crosswalk_v0142.py" \
            --workspace "$RUNNER_TEMP/helical-v0143/work" \
            --blind-image kch-helical-v0143-blind:locked \
            --timeout 240 \
            > "$RUNNER_TEMP/helical-v0143/control/GATE_STDOUT.txt" \
            2> "$RUNNER_TEMP/helical-v0143/control/GATE_STDERR.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/helical-v0143/control/GATE_EXIT_CODE.txt"
          echo "gate_exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/helical-v0143/control/GATE_STDOUT.txt"
          if [[ -s "$RUNNER_TEMP/helical-v0143/control/GATE_STDERR.txt" ]]; then
            cat "$RUNNER_TEMP/helical-v0143/control/GATE_STDERR.txt" >&2
          fi
          exit 0

      - name: Prove all raw and row-level artifacts were purged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/helical-v0143/work"
          test ! -e "$work/raw"
          test ! -e "$work/blind"
          test ! -e "$work/selection"
          test ! -e "$work/crosswalk"
          if find "$work/results" -type f \( -name '*.pickle' -o -name '*.npz' -o -name '*.part' -o -name '*.geojson' -o -name '*.csv' \) | grep -q .; then
            echo "forbidden raw or row-level artifact reached safe results" >&2
            exit 91
          fi
          if find "$work/results" -type f -iname '*CROSSWALK_ROWS*' | grep -q .; then
            echo "crosswalk rows reached safe results" >&2
            exit 92
          fi

      - name: Persist safe aggregate receipts append-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          destination="$ROOT/results/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$destination"
          cp -a "$RUNNER_TEMP/helical-v0143/work/results/." "$destination/"
          cp -a "$RUNNER_TEMP/helical-v0143/control/." "$destination/"
          find "$destination" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$destination/RESULT_SHA256SUMS.txt"
          python - "$destination" <<'PY'
          from pathlib import Path
          import hashlib, json, os, sys
          destination=Path(sys.argv[1]); rows=[]
          for path in sorted(item for item in destination.rglob('*') if item.is_file() and item.name!='RESULT_MANIFEST.json'):
              body=path.read_bytes()
              rows.append({'path':path.relative_to(destination).as_posix(),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          manifest={
            'format':'KCH_HELICAL_V0_14_3_SAFE_RESULT_MANIFEST',
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'github_sha':os.environ['GITHUB_SHA'],
            'predecessor_failed_run_receipt_id':'h14run:73d8aad92ed4d15e493c2d1ecf6de29e5fbe91c42e1615c3c33a0635aad7e7b7',
            'closed_geojson_run_receipt_id':'h14run:4e07a2a61c461b31dfbcc0f888d56fa4cab1ffbdd4e2106042b60c24e142728d',
            'observation_adapter_change':'USGS_FDSN_GEOJSON_SUMMARY_TO_USGS_FDSN_CSV_BULK',
            'scientific_matching_contract_changed':False,
            'coverage_threshold_changed':False,
            'raw_sources_included':False,
            'blind_rows_included':False,
            'selected_indices_included':False,
            'crosswalk_rows_included':False,
            'directional_rows_included':False,
            'sealed_test_values_included':False,
            'files':rows,
          }
          manifest['manifest_id']='h143manifest:'+hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (destination/'RESULT_MANIFEST.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "kch-helical-v0143-csv-gate"
          git config user.email "kch-helical-v0143-csv-gate@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then
            echo "No new receipts to persist"
          else
            git commit -m "record v0.14.3 FDSN CSV location-uncertainty receipts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload aggregate receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0143-csv-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROOT }}/results/run-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Adjudicate after immutable receipt persistence
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.gate_exit_code }}
        run: |
          set -euo pipefail
          case "${GATE_EXIT_CODE:-99}" in
            0)  echo "LOCATION_UNCERTAINTY_CROSSWALK_PASS: calibration-only full runtime qualification may be separately authorized; sealed test remains untouched" ;;
            30) echo "NOT_IDENTIFIABLE_LOCATION_UNCERTAINTY_COVERAGE: FDSN CSV also fails the frozen coverage gate; stop current specification without test access" ;;
            *)  echo "CSV_LOCATION_UNCERTAINTY_GATE_FAILED_CLOSED with exit ${GATE_EXIT_CODE:-99}" >&2; exit "${GATE_EXIT_CODE:-99}" ;;
          esac
