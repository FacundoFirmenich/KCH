name: KCH Helical v0.16.3.1 standalone source custody repair

on:
  push:
    branches:
      - helical-v0163-runtime-integration-source-custody-repair-20261011
    paths:
      - ".github/workflows/helical-v0163-1-runtime-integration-source-custody-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0163-1-source-custody-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT: construct_successors/KCH_HELICAL_V0163_RUNTIME_INTEGRATION_SOURCE_CUSTODY_REPAIR_20261011
  BUILDER: construct_successors/KCH_HELICAL_V0163_RUNTIME_INTEGRATION_SOURCE_CUSTODY_REPAIR_20261011/build_source_custody_v0163_1.py
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  source-custody-repair-v0163-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout finite successor branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0163-runtime-integration-source-custody-repair-20261011
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile standalone builder outside immutable source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v0163_1/pycache"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v0163_1/pycache" python -m py_compile "$BUILDER"

      - name: Build and independently verify deterministic source custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v0163_1/stage"
          mkdir -p "$RUNNER_TEMP/v0163_1/stage" "$ROOT/receipts"
          python "$BUILDER" "$RUNNER_TEMP/v0163_1/stage" "$ROOT"

      - name: Persist custody receipts append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0163-1-source-custody"
          git config user.email "kch-helical-v0163-1-source-custody@users.noreply.github.com"
          git add "$ROOT/receipts"
          if git diff --cached --quiet; then
            echo "No new receipt delta"
          else
            git commit -m "record v0.16.3.1 repaired runtime source custody [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload repaired code-and-contract source custody
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0163-1-source-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROOT }}/receipts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
