name: KCH Helical v0.16.4 historical null-ledger recovery

on:
  push:
    branches:
      - helical-v0164-historical-null-ledger-recovery-20261011
    paths:
      - ".github/workflows/helical-v0164-historical-null-ledger-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0164-historical-ledger-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT: construct_successors/KCH_HELICAL_V0164_HISTORICAL_NULL_LEDGER_RECOVERY_20261011
  RECOVER: construct_successors/KCH_HELICAL_V0164_HISTORICAL_NULL_LEDGER_RECOVERY_20261011/recover_historical_runtime_v0164.py
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  exact-historical-runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete Git lineage
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0164-historical-null-ledger-recovery-20261011
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify finite authority and frozen targets
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_16_4.json" >/dev/null
          python -m json.tool "$ROOT/controls/FULL_NULL_AND_PERTURBATION_RUNTIME_CONTRACT_V0_13.json" >/dev/null
          python -m json.tool "$ROOT/controls/NULL_PERTURBATION_JOB_LEDGER_SUMMARY_V0_13.json" >/dev/null
          python -m json.tool "$ROOT/controls/STATUS_V0_13.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/v0164/pycache"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v0164/pycache" python -m py_compile "$RECOVER"

      - name: Recover exact compiler runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/recovered_exact" "$ROOT/receipts" "$RUNNER_TEMP/v0164/reconstructed"
          mkdir -p "$ROOT/receipts" "$RUNNER_TEMP/v0164/reconstructed"
          python "$RECOVER" \
            --repo-root "$GITHUB_WORKSPACE" \
            --root "$ROOT" \
            --scratch "$RUNNER_TEMP/v0164/reconstructed"

      - name: Prove code-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if find "$ROOT/recovered_exact" "$ROOT/receipts" -type f \( \
              -name '*.pickle' -o -name '*.pkl' -o -name '*.npz' -o -name '*.npy' -o \
              -name '*.csv' -o -name '*.parquet' -o -name '*.geojson' -o -name '*.fits' -o \
              -name '*.sqlite' -o -name '*.db' \
            \) | grep -q .; then
            echo "scientific or row-level payload crossed v0.16.4 boundary" >&2
            exit 91
          fi
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          body=json.loads((root/'receipts/HISTORICAL_NULL_RUNTIME_RECOVERY_RECEIPT_V0_16_4.json').read_text())
          assert body['status']=='PASS'
          assert body['ledger_rows_regenerated'] is False
          assert body['calibration_executed'] is False
          assert body['scientific_data_accessed'] is False
          assert body['sealed_test_accessed'] is False
          assert body['scientific_result'] is None
          assert body['promotion']=='BLOCKED'
          assert body['canonicalization']=='BLOCKED'
          PY

      - name: Persist recovered exact code and receipts append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0164-historical-recovery"
          git config user.email "kch-helical-v0164-historical-recovery@users.noreply.github.com"
          git add "$ROOT/recovered_exact" "$ROOT/receipts"
          if git diff --cached --quiet; then
            echo "No recovery delta"
          else
            git commit -m "record v0.16.4 exact historical null-runtime recovery [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload code-only recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0164-historical-null-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROOT }}/recovered_exact
            ${{ env.ROOT }}/receipts
            ${{ env.ROOT }}/controls
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
