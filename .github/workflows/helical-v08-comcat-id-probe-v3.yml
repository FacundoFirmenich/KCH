name: Helical v0.8 ComCat ID/covariance probe v3

on:
  push:
    branches:
      - gate/helical-v08-dynamic-confirmatory-20260927
    paths:
      - .github/workflows/helical-v08-comcat-id-probe-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned NumPy
        run: python -m pip install 'numpy==2.1.3'
      - name: Recover selected directional materialization by immutable artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10934329977'
          EXPECTED_ARTIFACT_SHA256: 'ba2858030909b02c83ae107b062cce705bf6f485834c3e556c328dcd8d81e066'
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/input.zip"; input="$RUNNER_TEMP/input"
          curl --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$zip"
          test "$(sha256sum "$zip"|awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA256"
          mkdir -p "$input"; unzip -q "$zip" -d "$input"
      - name: Probe deterministic event-id candidates without accessing angle arrays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/comcat_probe"
          python - <<'PY' | tee "$RUNNER_TEMP/comcat_probe/STDOUT.log"
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          import numpy as np
          root=Path(os.environ["RUNNER_TEMP"])/"input"
          candidates=list(root.rglob("selected_directional_columns.npz"))
          if len(candidates)!=1: raise SystemExit(f"expected one npz: {candidates}")
          with np.load(candidates[0], allow_pickle=False) as z:
              keys=["evid","nc_sc","year","month","day","hour","minute","second","lat_reloc","lon_reloc","dep_reloc","mag","cohort_code"]
              data={k:z[k] for k in keys}
              if any(k in data for k in ["strike","dip","rake"]): raise SystemExit("directional firewall violation")
          idxs=[0,1,100,1000,10000,37852,37853,40000,50000,61554]
          rows=[]
          for i in idxs:
              evid=int(float(data["evid"][i]))
              src_dt=datetime(int(data["year"][i]),int(data["month"][i]),int(data["day"][i]),int(data["hour"][i]),int(data["minute"][i]),tzinfo=timezone.utc)
              src_epoch=(src_dt.timestamp()+float(data["second"][i]))
              seen=set()
              for net in ["nc","ci"]:
                  for code in [str(evid),f"{evid:08d}"]:
                      eventid=net+code
                      if eventid in seen: continue
                      seen.add(eventid)
                      url="https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&eventid="+eventid
                      req=urllib.request.Request(url,headers={"User-Agent":"KCH-Helical-v0.8-ComCat-probe","Accept-Encoding":"identity"})
                      rec={"index":i,"source_evid":evid,"source_nc_sc":str(data["nc_sc"][i]),"source_epoch":src_epoch,
                           "source_lat":float(data["lat_reloc"][i]),"source_lon":float(data["lon_reloc"][i]),
                           "source_depth":float(data["dep_reloc"][i]),"source_mag":float(data["mag"][i]),
                           "cohort_code":int(data["cohort_code"][i]),"candidate":eventid}
                      try:
                          with urllib.request.urlopen(req,timeout=20) as r:
                              obj=json.loads(r.read())
                          features=obj.get("features",[]); rec["http"]=200; rec["count"]=len(features)
                          if features:
                              f=features[0]; p=f["properties"]; c=f["geometry"]["coordinates"]
                              rec.update(match_id=f["id"],dt_seconds=(float(p.get("time"))/1000-src_epoch),
                                         comcat_lon=c[0],comcat_lat=c[1],comcat_depth=c[2],comcat_mag=p.get("mag"),
                                         horizontalError=p.get("horizontalError"),depthError=p.get("depthError"),
                                         locationSource=p.get("locationSource"),ids=p.get("ids"))
                      except urllib.error.HTTPError as e: rec["http"]=e.code
                      except Exception as e: rec["error"]=type(e).__name__+":"+str(e)
                      rows.append(rec)
          out=Path(os.environ["RUNNER_TEMP"])/"comcat_probe"
          (out/"COMCAT_ID_PROBE.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v08-comcat-id-probe-v3
          path: ${{ runner.temp }}/comcat_probe
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
