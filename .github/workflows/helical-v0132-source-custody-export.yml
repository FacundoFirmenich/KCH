name: KCH Helical v0.13.2 source custody export

on:
  push:
    branches:
      - helical-v0132-calibration-runtime-qualification-20261009
    paths:
      - ".github/workflows/helical-v0132-source-custody-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout finite successor branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0132-calibration-runtime-qualification-20261009
          fetch-depth: 0

      - name: Build content-addressed source custody bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/helical-v0132-source-custody"
          mkdir -p "$root/source" "$root/control"
          for path in \
            construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009 \
            construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009 \
            construct_successors/KCH_HELICAL_V012_PARENT_GRAPH_LOCK_20261009 \
            construct_successors/KCH_HELICAL_V0132_CALIBRATION_RUNTIME_QUALIFICATION_20261009 \
            .github/workflows/helical-v010-remote-gate-geometry.yml \
            .github/workflows/helical-v011-directional-pretest.yml \
            .github/workflows/helical-v012-parent-graph-lock.yml; do
            test -e "$path"
            mkdir -p "$root/source/$(dirname "$path")"
            cp -a "$path" "$root/source/$path"
          done
          find "$root/source" -type d -name results -prune -exec rm -rf {} +
          find "$root/source" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$root/control/SOURCE_SHA256SUMS.txt"
          python - "$root" <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys
          root=Path(sys.argv[1]); source=root/'source'; rows=[]
          for p in sorted(x for x in source.rglob('*') if x.is_file()):
              b=p.read_bytes(); rows.append({'path':p.relative_to(source).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          body={'format':'KCH_HELICAL_V0_13_2_SOURCE_CUSTODY_EXPORT','github_sha':os.environ['GITHUB_SHA'],'github_ref':os.environ['GITHUB_REF'],'file_count':len(rows),'files':rows,'scientific_execution_performed':False,'sealed_test_accessed':False}
          body['receipt_id']='h132sourcecustody:'+hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'control'/'SOURCE_CUSTODY_RECEIPT.json').write_text(json.dumps(body,sort_keys=True,indent=2)+'\n')
          print(body['receipt_id'])
          PY

      - name: Upload source custody bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0132-source-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helical-v0132-source-custody
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
