name: KCH Mendeley public route probe

on:
  pull_request:
    paths:
      - "construct_successors/KCH_HELICAL_V09_REMOTE_GATE_20261009_R2/probe_mendeley_public_routes.py"
      - ".github/workflows/kch-mendeley-public-route-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Probe public official routes without credentials
        run: |
          set -euo pipefail
          python construct_successors/KCH_HELICAL_V09_REMOTE_GATE_20261009_R2/probe_mendeley_public_routes.py
      - name: Archive probe evidence
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf mendeley-public-route-probe.tar.gz probe-output
          sha256sum mendeley-public-route-probe.tar.gz > mendeley-public-route-probe.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-mendeley-public-route-probe-{{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mendeley-public-route-probe.tar.gz
            mendeley-public-route-probe.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
