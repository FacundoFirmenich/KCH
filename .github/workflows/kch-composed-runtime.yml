name: KCH composed runtime contracts
on:
  pull_request:
    paths:
      - 'integrations/kch-composed-runtime/**'
      - 'integrations/kwan-external-conformance/**'
      - 'work/SCO_RELEASE_STAGE_v0.1.1/**'
      - 'construct_successors/KCH_ALL_IN_ONE_0.11.33_STUDIO_0.3.16_AIO2/**'
      - '.github/workflows/kch-composed-runtime.yml'
      - '.github/workflows/kwan-external-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Federation dependencies
        run: python -m pip install './integrations/kch-composed-runtime[federation]'
      - name: Actual local tools, state, recovery and protocol contracts
        working-directory: integrations/kch-composed-runtime
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Portable host profile generation
        working-directory: integrations/kch-composed-runtime
        run: python -m unittest discover -s profiles -p 'test*.py' -v
