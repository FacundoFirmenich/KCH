name: BIFM v0.9 cross-model identifiability frontier

on:
  push:
    branches:
      - bifm/v0.9.0-alpha0-crossmodel-identifiability-frontier
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: qwen3_06b
            model_id: Qwen/Qwen3-0.6B
            revision: c1899de289a04d12100db370d81485cdf75e47ca
            layers: "14"
            batch: "8"
            cache_key: qwen3-06b-c1899de289a04d12100db370d81485cdf75e47ca
          - tag: smollm2_360m
            model_id: HuggingFaceTB/SmolLM2-360M-Instruct
            revision: a10cc1512eabd3dde888204e902eca88bddb4951
            layers: "8,16,24"
            batch: "16"
            cache_key: smollm2-360m-a10cc1512eabd3dde888204e902eca88bddb4951
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      MODEL_ID: ${{ matrix.model_id }}
      MODEL_REVISION: ${{ matrix.revision }}
      MODEL_TAG: ${{ matrix.tag }}
      LAYER_SPEC: ${{ matrix.layers }}
      BATCH: ${{ matrix.batch }}
      BIFM_OUT: bifm_v090_${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore frozen model cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: bifm-${{ matrix.cache_key }}
      - name: Install CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers>=4.51,<5" accelerate pandas pyarrow huggingface_hub
      - name: Execute identifiability frontier
        run: |
          python research/bifm/v0.9.0-alpha0/identifiability_frontier.py | tee bifm_v090_${{ matrix.tag }}_full_run.txt
      - name: Integrity receipts
        run: |
          sha256sum research/bifm/v0.9.0-alpha0/identifiability_frontier.py bifm_v090_${{ matrix.tag }}/frontier_receipt.json bifm_v090_${{ matrix.tag }}_full_run.txt | tee bifm_v090_${{ matrix.tag }}_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIFM-v0.9-${{ matrix.tag }}-frontier
          path: |
            bifm_v090_${{ matrix.tag }}/
            bifm_v090_${{ matrix.tag }}_full_run.txt
            bifm_v090_${{ matrix.tag }}_sha256.txt
          if-no-files-found: error
