name: Helical v0.8 exact-byte blind eligibility v3

on:
  push:
    branches:
      - gate/helical-v08-blind-eligibility-20260927
    paths:
      - .github/workflows/helical-v08-blind-eligibility-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUNDLE_B64_SHA256: 18ea03307486405fca419fd76d8d8d6e19351538f1994c0695d7aa118e108d4e
      BUNDLE_ZIP_SHA256: 9991c7b4f88e78a56725f3f450ec5cf89e62701ad64a0a716ada633eeca236cb
      ORIGINAL_ACQUISITION_SHA256: 0598cae1711cff2465e0fafa0ef327734f298d11aa33be1cf645b6a0f64deb19
      PUBLIC_WEB_ACQUISITION_SHA256: a49000d5b0f1665e1302c2e57de3cca6e46502aadd801abdf9ced153c83048ff
      ORIGINAL_EXTRACTOR_SHA256: 1f2383e43946b0e728b56c4183cbe750fb8f3b5a13303aa35ebfa53ce7704f35
      SCALAR_NUM_EXTRACTOR_SHA256: 60e900eb96819b0019d8b3dc1046c37879c983eeddd014f075b7e3229ef00fe9
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned host-side eligibility dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pyproj==3.7.0' 'shapely==2.0.6'

      - name: Reconstruct and verify the locked runtime carrier
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/helical_v08"
          mkdir -p "$root/runtime"
          b64="$root/runtime.b64"
          zip="$root/runtime.zip"
          cat \
            .github/helical_v08_bundle_v2/chunk_00 \
            .github/helical_v08_bundle_v2/chunk_01 \
            .github/helical_v08_bundle_v2/chunk_02 \
            > "$b64"
          echo "$BUNDLE_B64_SHA256  $b64" | sha256sum -c -
          base64 --decode "$b64" > "$zip"
          echo "$BUNDLE_ZIP_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$root/runtime"
          python -m compileall -q "$root/runtime"
          cmp --silent .github/helical_v08/protocol.json "$root/runtime/runtime/protocol.json"

      - name: Apply transport-only and scalar-count schema successors before source access
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/helical_v08"
          artifact="$root/work/artifact"
          mkdir -p "$artifact"
          acquisition_original="$root/runtime/runtime/acquire_exact_sources.py"
          acquisition_replacement=.github/helical_v08/acquire_exact_sources_public.py
          extractor_original="$root/runtime/runtime/extract_blind_safe.py"
          extractor_replacement=.github/helical_v08/extract_blind_safe_scalar_num.py
          echo "$ORIGINAL_ACQUISITION_SHA256  $acquisition_original" | sha256sum -c -
          echo "$PUBLIC_WEB_ACQUISITION_SHA256  $acquisition_replacement" | sha256sum -c -
          echo "$ORIGINAL_EXTRACTOR_SHA256  $extractor_original" | sha256sum -c -
          echo "$SCALAR_NUM_EXTRACTOR_SHA256  $extractor_replacement" | sha256sum -c -
          cp "$acquisition_replacement" "$acquisition_original"
          cp "$extractor_replacement" "$extractor_original"
          echo "$PUBLIC_WEB_ACQUISITION_SHA256  $acquisition_original" | sha256sum -c -
          echo "$SCALAR_NUM_EXTRACTOR_SHA256  $extractor_original" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'helical_v08'
          body = {
              'format': 'KCH_HELICAL_V0_8_PREACCESS_SUCCESSOR_RECEIPT',
              'scope': [
                  'ACQUISITION_TRANSPORT_ONLY',
                  'NUM_DECLARED_COUNT_SCALAR_CARDINALITY_ONLY',
              ],
              'acquisition_original_sha256': os.environ['ORIGINAL_ACQUISITION_SHA256'],
              'acquisition_replacement_sha256': os.environ['PUBLIC_WEB_ACQUISITION_SHA256'],
              'extractor_original_sha256': os.environ['ORIGINAL_EXTRACTOR_SHA256'],
              'extractor_replacement_sha256': os.environ['SCALAR_NUM_EXTRACTOR_SHA256'],
              'protocol_changed': False,
              'scientific_models_changed': False,
              'thresholds_changed': False,
              'event_values_changed': False,
              'directional_fields_accessed': False,
              'applied_before_source_access': True,
              'applied_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'authority_ceiling': 'NONE',
          }
          canonical = json.dumps(body, sort_keys=True, separators=(',', ':')).encode()
          body['receipt_id'] = 'h8preaccess:' + hashlib.sha256(canonical).hexdigest()
          path = root / 'work' / 'artifact' / 'PREACCESS_SUCCESSOR_RECEIPT_V0_8.json'
          path.write_text(json.dumps(body, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Freeze successor sandbox, acquire exact bytes, extract blind-safe columns, and adjudicate eligibility
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/helical_v08"
          PYTHONUNBUFFERED=1 python "$root/runtime/runtime/orchestrate_blind.py" \
            --runtime "$root/runtime/runtime" \
            --work "$root/work" \
            | tee "$root/orchestrator_stdout.log"
          cp "$root/orchestrator_stdout.log" "$root/work/artifact/ORCHESTRATOR_STDOUT.log"

      - name: Upload sealed material-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v08-blind-eligibility-v3
          path: ${{ runner.temp }}/helical_v08/work/artifact
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
