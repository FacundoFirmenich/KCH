name: KCH Helical v0.9 exact-byte to blind eligibility

on:
  push:
    branches:
      - gate/helical-v09-exact-byte-blind-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kch-helical-v09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-byte-to-blind:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CAPSULE_TRANSPORT_DIR: experiments/helical-v09-exact-byte-blind/runtime_capsule_transport
      DELIVERY_MANIFEST_REL: experiments/helical-v09-exact-byte-blind/source_lock/KCH_KWANBLOCKS_HELICAL_LIFT_v0_8_0_DELIVERY_MANIFEST.json
      DELIVERY_MANIFEST_SHA256: e216f04c85d20b8d9fa7426a17884ed9f4af03e237aa96f9f1ad4e0c522f7158
      CAPSULE_B64_BYTES: "62596"
      CAPSULE_B64_SHA256: 705cf34c60fe51623e05522d4e8e0f7d2dc56c385307f78baea28008a07632a6
      CAPSULE_TGZ_BYTES: "46947"
      CAPSULE_TGZ_SHA256: 4f265ea4e859b0e9a0a7cfcb078907abd3ca971facbd6c1ed8d5551e7a4b37a0

    steps:
      - name: Checkout immutable workflow commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Initialize append-only execution receipt surface
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/helical-v09"
          mkdir -p "$WORK/receipts"
          python - "$WORK/receipts/WORKFLOW_BOOTSTRAP_RECEIPT.json" <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          body = {
              "format": "KCH_HELICAL_V0_9_WORKFLOW_BOOTSTRAP_RECEIPT",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scientific_execution_performed": False,
              "directional_fields_unsealed": False,
              "model_fitting_performed": False,
              "physical_helicity": "NOT_EVALUATED",
              "authority_ceiling": "NONE",
              "promotion": "BLOCKED",
              "canonicalization": "BLOCKED",
              "state": "WORKFLOW_STARTED",
          }
          out.write_text(json.dumps(body, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Set up Python 3.11 from immutable action commit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Reconstruct and verify governed v0.9 runtime capsule
        id: capsule
        shell: bash
        run: |
          set -euo pipefail
          TRANSPORT="$GITHUB_WORKSPACE/$CAPSULE_TRANSPORT_DIR"
          DELIVERY="$GITHUB_WORKSPACE/$DELIVERY_MANIFEST_REL"
          STAGE="$RUNNER_TEMP/helical-v09-capsule"
          WORK="$RUNNER_TEMP/helical-v09"
          ENCODED="$STAGE/runtime-capsule.tar.gz.b64"
          ARCHIVE="$STAGE/runtime-capsule.tar.gz"
          ROOT="$STAGE/root"
          rm -rf "$STAGE"
          mkdir -p "$ROOT" "$WORK/receipts"

          printf '%s  %s\n' "$DELIVERY_MANIFEST_SHA256" "$DELIVERY" | sha256sum -c -

          cat \
            "$TRANSPORT/segment-00-0.b64" \
            "$TRANSPORT/segment-00-1.b64" \
            "$TRANSPORT/chunk-01.b64" \
            "$TRANSPORT/chunk-02.b64" \
            "$TRANSPORT/chunk-03.b64" \
            "$TRANSPORT/chunk-04.b64" \
            "$TRANSPORT"/atom-05-*.b64 \
            "$TRANSPORT/chunk-06.b64" \
            "$TRANSPORT"/atom-07-*.b64 \
            > "$ENCODED"

          test "$(wc -c < "$ENCODED" | tr -d ' ')" = "$CAPSULE_B64_BYTES"
          printf '%s  %s\n' "$CAPSULE_B64_SHA256" "$ENCODED" | sha256sum -c -
          base64 --decode "$ENCODED" > "$ARCHIVE"
          test "$(wc -c < "$ARCHIVE" | tr -d ' ')" = "$CAPSULE_TGZ_BYTES"
          printf '%s  %s\n' "$CAPSULE_TGZ_SHA256" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$ROOT"
          (cd "$ROOT" && sha256sum -c CAPSULE_SHA256SUMS.txt)

          python "$ROOT/runtime/AUDIT_PROTOCOL_LOCK_V0_8.py" \
            --protocol "$ROOT/source_lock/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json" \
            --delivery-manifest "$DELIVERY" \
            --output "$WORK/receipts/PROTOCOL_LOCK_AUDIT_V0_8.json"

          python - "$WORK/receipts/PROTOCOL_LOCK_AUDIT_V0_8.json" <<'PY'
          import json, pathlib, sys
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("status") != "PASS" or not all(receipt.get("checks", {}).values()):
              raise SystemExit("protocol lock audit did not pass")
          PY

          echo "capsule_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Install frozen runtime dependencies
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.capsule.outputs.capsule_root }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/helical-v09"
          python -m pip install --disable-pip-version-check -r "$CAPSULE_ROOT/requirements-runtime.txt"
          python -m pip freeze --all | LC_ALL=C sort > "$WORK/receipts/PIP_FREEZE.txt"
          python - "$WORK/receipts" <<'PY'
          import hashlib, json, pathlib, platform, sys
          out = pathlib.Path(sys.argv[1])
          freeze = (out / "PIP_FREEZE.txt").read_bytes()
          (out / "RUNTIME_ENVIRONMENT.json").write_text(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "pip_freeze_sha256": hashlib.sha256(freeze).hexdigest(),
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Execute exact-byte acquisition, sandbox extraction, and blind eligibility
        id: gate
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.capsule.outputs.capsule_root }}
        run: |
          set +e
          python "$CAPSULE_ROOT/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py" \
            --workspace "$RUNNER_TEMP/helical-v09" \
            --execute-network \
            --network-timeout-seconds 1200 \
            --sandbox-timeout-seconds 7200 \
            --sandbox-memory-mib 6144 \
            --purge-raw-after-gate
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/helical-v09/receipts/GATE_EXIT_CODE.txt"
          echo "gate_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Purge all raw or partial source bodies from export surface
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/helical-v09"
          mkdir -p "$WORK/receipts"
          rm -rf "$WORK/exact_sources" "$WORK/cache" "$WORK/quarantine"
          if find "$WORK" -type f \( \
              -name '*.pickle' -o \
              -name '*.part' -o \
              -name 'gem_active_faults_harmonized.geojson' -o \
              -name 'mendeley_dataset_snapshot_v2.json' \
            \) -print -quit | grep -q .; then
            echo "raw or partial source material remained after purge" >&2
            exit 1
          fi

      - name: Seal terminal workflow status receipt
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.gate_exit_code }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/helical-v09"
          mkdir -p "$WORK/receipts"
          python - "$WORK/receipts/WORKFLOW_TERMINAL_RECEIPT.json" "${GATE_EXIT_CODE:-99}" <<'PY'
          import hashlib, json, os, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          gate_exit = int(sys.argv[2])
          if gate_exit == 0:
              state = "ELIGIBILITY_PASS_DIRECTIONAL_UNSEAL_REQUEST_READY"
              legitimacy = "SCIENTIFIC_GATE_RESULT"
          elif gate_exit == 30:
              state = "NOT_IDENTIFIABLE_MECHANISM_COVERAGE"
              legitimacy = "SCIENTIFIC_GATE_RESULT"
          elif gate_exit == 99:
              state = "WORKFLOW_INFRASTRUCTURE_FAILURE_BEFORE_GATE"
              legitimacy = "NON_SCIENTIFIC_FAILURE"
          else:
              state = "GATE_INFRASTRUCTURE_OR_TRANSPORT_BLOCKED"
              legitimacy = "NON_SCIENTIFIC_FAILURE"
          body = {
              "format": "KCH_HELICAL_V0_9_WORKFLOW_TERMINAL_RECEIPT",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "gate_exit_code": gate_exit,
              "state": state,
              "result_class": legitimacy,
              "directional_fields_unsealed": False,
              "model_fitting_performed": False,
              "physical_helicity": "NOT_EVALUATED",
              "authority_ceiling": "NONE",
              "promotion": "BLOCKED",
              "canonicalization": "BLOCKED",
          }
          canonical = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          body["receipt_id"] = "h9workflow:" + hashlib.sha256(canonical).hexdigest()
          out.write_text(json.dumps(body, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build deterministic safe-result archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/helical-v09"
          mkdir -p "$WORK/receipts"
          cd "$WORK"
          paths=(receipts)
          for candidate in blind eligibility; do
            [[ -e "$candidate" ]] && paths+=("$candidate")
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf helical-v09-result-without-raw-sources.tar.gz "${paths[@]}"
          sha256sum helical-v09-result-without-raw-sources.tar.gz \
            > helical-v09-result-without-raw-sources.tar.gz.sha256

      - name: Upload receipts and safe derived artifacts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kch-helical-v09-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/helical-v09/helical-v09-result-without-raw-sources.tar.gz
            ${{ runner.temp }}/helical-v09/helical-v09-result-without-raw-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Adjudicate governed gate after evidence upload
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.gate_exit_code }}
        run: |
          set -euo pipefail
          case "${GATE_EXIT_CODE:-99}" in
            0)  echo "ELIGIBILITY_PASS; directional-unseal request prepared; no model fit" ;;
            30) echo "LEGITIMATE_NOT_IDENTIFIABLE_MECHANISM_COVERAGE; no model fit" ;;
            *)  echo "Infrastructure or transport gate failed with exit ${GATE_EXIT_CODE:-99}" >&2; exit "${GATE_EXIT_CODE:-99}" ;;
          esac
