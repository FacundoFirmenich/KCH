name: PG006 Mixture Advantage

on:
  workflow_dispatch:
  push:
    branches:
      - pg006-decision-coupled-router-20260927
    paths:
      - ".github/workflows/pg006_advantage.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: pg006-advantage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advantage:
    strategy:
      fail-fast: false
      matrix:
        backend: [pymc, numpyro]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout frozen advantage code and receipt
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/pi_genesis/pg006_advantage
          sparse-checkout-cone-mode: false

      - name: Download posterior regret field
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FacundoFirmenich/KCH
          run-id: 36327778711
          name: pg006-field-${{ matrix.backend }}
          path: field

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMC advantage runtime
        if: matrix.backend == 'pymc'
        run: >-
          python -m pip install --upgrade "pip<27" "numpy<3" "scipy<2" "arviz>=0.20,<1"
          "pymc>=5.20,<6"

      - name: Install NumPyro advantage runtime
        if: matrix.backend == 'numpyro'
        run: >-
          python -m pip install --upgrade "pip<27" "numpy<3" "scipy<2" "arviz>=0.20,<1"
          "jax[cpu]>=0.5,<0.10" "numpyro>=0.19,<0.22"

      - name: Compile frozen mixture-advantage surface
        shell: bash
        run: |
          set -euo pipefail
          python experiments/pi_genesis/pg006_advantage/build_advantage_input.py \
            --backend ${{ matrix.backend }} \
            --field-dir field \
            --freeze experiments/pi_genesis/pg006_advantage/ROUTER_CALIBRATION_FREEZE.json \
            --output work/advantage_${{ matrix.backend }}.npz

      - name: Fit external-PPL advantage calibrator
        env:
          PYTHONPATH: experiments/pi_genesis/pg006_advantage:experiments/pi_genesis/pg006_advantage/generated
          PYTHONHASHSEED: "0"
          JAX_ENABLE_X64: "true"
          XLA_FLAGS: --xla_force_host_platform_device_count=1
        run: >-
          python experiments/pi_genesis/pg006_advantage/advantage_runner.py
          --backend ${{ matrix.backend }}
          --input work/advantage_${{ matrix.backend }}.npz
          --output results/pg006-advantage-${{ matrix.backend }}

      - name: Preserve compiled advantage input
        shell: bash
        run: |
          cp work/advantage_${{ matrix.backend }}.npz results/pg006-advantage-${{ matrix.backend }}/
          cp work/advantage_${{ matrix.backend }}.json results/pg006-advantage-${{ matrix.backend }}/

      - name: Upload content-addressed advantage field
        uses: actions/upload-artifact@v4
        with:
          name: pg006-advantage-${{ matrix.backend }}
          path: results/pg006-advantage-${{ matrix.backend }}
          if-no-files-found: error
          retention-days: 30
