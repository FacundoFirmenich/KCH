name: Helical v1.2 direct vector-field observability gate

on:
  push:
    branches:
      - gate/helical-v12-theory-mhd-direct-field-20261012
    paths:
      - .github/helical_v12/direct_vector_field_gate.py
      - .github/workflows/helical-v12-direct-field-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-field:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned scientific dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'astropy==6.1.4' 'drms==0.9.0' 'requests==2.32.3'
      - name: Execute exact-byte direct-field observability gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/helical_v12_direct_field"
          mkdir -p "$out"
          PYTHONUNBUFFERED=1 python .github/helical_v12/direct_vector_field_gate.py             --lock transports/KCH_HELICOIDAL_PROGRAM_v1.2.0/MHD_DIRECT_VECTOR_FIELD_OBSERVABILITY_LOCK_V1_2.json             --out "$out" | tee "$out/EXECUTION_STDOUT.log"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload sealed direct-field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v12-direct-vector-field-gate
          path: ${{ runner.temp }}/helical_v12_direct_field
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
