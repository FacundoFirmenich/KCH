name: KCH Helical v0.17.5 real calibration input binding

on:
  push:
    branches:
      - helical-v0175-real-calibration-binding-20261012
    paths:
      - ".github/workflows/helical-v0175-real-calibration-binding.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0175-real-calibration-binding-${{ github.ref }}
  cancel-in-progress: false

env:
  V10: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009
  V11: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009
  V12: construct_successors/KCH_HELICAL_V012_PARENT_GRAPH_LOCK_20261009
  V174: construct_successors/KCH_HELICAL_V0174_CALIBRATION_RUNTIME_QUALIFICATION_20261012
  ROOT: construct_successors/KCH_HELICAL_V0175_REAL_CALIBRATION_BINDING_20261012
  PROTOCOL: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/protocol/HELICAL_DYNAMIC_MARKED_POINT_PROCESS_GATE_V0_8_LOCKED.json
  ELIGIBILITY: construct_successors/KCH_HELICAL_V010_REMOTE_GATE_20261009/results/run-37919577887-1/BLIND_ELIGIBILITY_RESULT_V0_10.json
  V11_RUN: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009/results/run-37920569317-1/RUN_RECEIPT_V0_11.json
  V11_PREFLIGHT: construct_successors/KCH_HELICAL_V011_DIRECTIONAL_PRETEST_20261009/results/run-37920569317-1/DIRECTIONAL_PREFLIGHT_RESULT_V0_11.json
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  exact-real-calibration-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout complete lineage
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0175-real-calibration-binding-20261012
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact historical inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir             numpy==2.1.3 scipy==1.14.1 pyproj==3.7.0 shapely==2.0.6
          python - <<'PY'
          import numpy, scipy, pyproj, shapely
          assert numpy.__version__=="2.1.3"
          assert scipy.__version__=="1.14.1"
          assert pyproj.__version__=="3.7.0"
          assert shapely.__version__=="2.0.6"
          PY

      - name: Verify finite authority predecessor and frozen code
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_17_5_PARENT_ENCLAVE.json" >/dev/null
          python -m json.tool "$PROTOCOL" >/dev/null
          python -m json.tool "$ELIGIBILITY" >/dev/null
          python -m json.tool "$V11_RUN" >/dev/null
          python -m json.tool "$V11_PREFLIGHT" >/dev/null
          python -m json.tool "$V174/results/FULL_RUNTIME_QUALIFICATION_RECEIPT_V0_17_4.json" >/dev/null
          python -m json.tool "$V174/results/FULL_RUNTIME_QUALIFICATION_VALIDATION_V0_17_4.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/v0175/pycache"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v0175/pycache" python -m py_compile             "$ROOT/adjudicate_real_calibration_binding_v0175.py"             "$V12/helical_v012_parent_graph_gate.py"             "$V12/build_topology_lock_v012.py"             "$V12/directional_preflight_frozen_v08.py"             "$V12/fit_parent_graph_lock_frozen_v08.py"             "$V11/extract_blind_v011.py"             "$V11/extract_selected_directional_v011.py"             "$V11/helical_v011_directional_pretest.py"             "$V11/helical_v011_directional_pretest_core.py"             "$V10/helical_remote_gate.py"             "$V10/helical_public_acquisition.py"             "$V10/helical_geometry_adapter.py"

      - name: Freeze exact networkless extraction images
        shell: bash
        run: |
          set -euo pipefail
          images="$RUNNER_TEMP/v0175/images"
          mkdir -p "$images/blind" "$images/directional"
          base="docker.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89"
          docker pull "$base"
          python -m pip download --only-binary=:all: --no-deps --dest "$images" numpy==2.1.3
          wheel=$(find "$images" -maxdepth 1 -name 'numpy-*.whl' -type f -print -quit)
          test -n "$wheel"
          observed=$(sha256sum "$wheel" | awk '{print $1}')
          test "$observed" = "bc6f24b3d1ecc1eebfbf5d6051faa49af40b03be1aaa781ebdadcbc090b4539b"
          cp "$wheel" "$images/blind/"
          cp "$wheel" "$images/directional/"
          cp "$V11/extract_blind_v011.py" "$images/blind/extractor.py"
          cp "$V11/extract_selected_directional_v011.py" "$images/directional/extractor.py"
          wheel_name=$(basename "$wheel")
          for kind in blind directional; do
            cat > "$images/$kind/Dockerfile" <<EOF
          FROM $base
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
          COPY $wheel_name /wheels/$wheel_name
          RUN pip install --no-cache-dir --no-index /wheels/$wheel_name && rm -rf /wheels
          COPY extractor.py /app/extractor.py
          ENTRYPOINT ["python", "/app/extractor.py"]
          EOF
            docker build --pull=false --network=none -t "kch-helical-v0175-$kind:locked" "$images/$kind"
          done
          rm -rf "$images"

      - name: Regenerate exact immutable-source parent calibration enclave
        id: enclave
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/v0175/work"
          mkdir -p "$RUNNER_TEMP/v0175/work"
          PYTHONPATH="$GITHUB_WORKSPACE/$V10:$GITHUB_WORKSPACE/$V11:$GITHUB_WORKSPACE/$V12"           python "$V12/helical_v012_parent_graph_gate.py"             --protocol "$PROTOCOL"             --authority "$ROOT/AUTHORITY_LEASE_V0_17_5_PARENT_ENCLAVE.json"             --eligibility-result "$ELIGIBILITY"             --v11-run "$V11_RUN"             --v11-preflight "$V11_PREFLIGHT"             --directional-preflight-runtime "$V12/directional_preflight_frozen_v08.py"             --topology-runtime "$V12/build_topology_lock_v012.py"             --parent-graph-runtime "$V12/fit_parent_graph_lock_frozen_v08.py"             --workspace "$RUNNER_TEMP/v0175/work"             --blind-image kch-helical-v0175-blind:locked             --directional-image kch-helical-v0175-directional:locked             --timeout 1200             > "$RUNNER_TEMP/v0175/enclave.stdout"             2> "$RUNNER_TEMP/v0175/enclave.stderr"
          rc=$?
          set -e
          echo "enclave_exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -c 20000 "$RUNNER_TEMP/v0175/enclave.stdout" || true
          tail -c 20000 "$RUNNER_TEMP/v0175/enclave.stderr" >&2 || true
          exit 0

      - name: Prove enclave purge before runtime binding
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.enclave.outputs.enclave_exit_code }}" = "0"
          work="$RUNNER_TEMP/v0175/work"
          test ! -e "$work/raw"
          test ! -e "$work/selected_root"
          test ! -e "$work/topology"
          test ! -e "$work/parent_graph"
          if find "$work/results" -type f \(               -name '*.pickle' -o -name '*.pkl' -o -name '*.npz' -o -name '*.npy' -o               -name '*.part' -o -name '*.geojson' -o -name '*.csv' -o -name '*.parquet'             \) | grep -q .; then
            echo "row-level/raw artifact escaped the partitioning enclave" >&2
            exit 91
          fi

      - name: Adjudicate content-addressed real calibration binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/results"
          mkdir -p "$ROOT/results"
          python "$ROOT/adjudicate_real_calibration_binding_v0175.py"             --regenerated-results "$RUNNER_TEMP/v0175/work/results"             --v0174-results "$V174/results"             --output "$ROOT/results"
          cp "$RUNNER_TEMP/v0175/work/results/ACQUISITION_RECEIPT_V0_12.json" "$ROOT/results/REGENERATED_ACQUISITION_RECEIPT_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/SELECTED_INDEX_RECEIPT_V0_12.json" "$ROOT/results/REGENERATED_SELECTION_RECEIPT_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/SELECTED_DIRECTIONAL_EXTRACTION_RECEIPT_V0_12.json" "$ROOT/results/REGENERATED_DIRECTIONAL_EXTRACTION_RECEIPT_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/DIRECTIONAL_PREFLIGHT_RECONCILIATION_V0_12.json" "$ROOT/results/REGENERATED_PREFLIGHT_RECONCILIATION_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/ETAS_HAWKES_PARENT_GRAPH_PARAMETER_LOCK_V0_12.json" "$ROOT/results/REGENERATED_PARENT_GRAPH_PARAMETER_LOCK_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/PARENT_GRAPH_CALIBRATION_RESULT_V0_12.json" "$ROOT/results/REGENERATED_PARENT_GRAPH_CALIBRATION_RESULT_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/EPHEMERAL_PARENT_EDGE_DIGEST_RECEIPT_V0_12.json" "$ROOT/results/REGENERATED_PARENT_EDGE_DIGEST_RECEIPT_V0_17_5.json"
          cp "$RUNNER_TEMP/v0175/work/results/RUN_RECEIPT_V0_12.json" "$ROOT/results/REGENERATION_RUN_RECEIPT_V0_17_5.json"

      - name: Verify explicit two-domain firewall
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1]); out=root/'results'
          binding=json.loads((out/'REAL_CALIBRATION_INPUT_BINDING_V0_17_5.json').read_text())
          validation=json.loads((out/'REAL_CALIBRATION_INPUT_BINDING_VALIDATION_V0_17_5.json').read_text())
          assert binding['status']=='PASS'
          assert validation['status']=='PASS'
          assert validation['binding_id']==binding['binding_id']
          assert binding['runtime_admitted_train_plus_calibration_event_count']==45432
          assert binding['sealed_test_event_count']==15145
          assert binding['partitioning_enclave']['selected_directional_rows_temporarily_materialized'] is True
          assert binding['partitioning_enclave']['sealed_test_partition_values_temporarily_present_for_observability_partitioning'] is True
          assert binding['partitioning_enclave']['sealed_test_scored'] is False
          assert binding['partitioning_enclave']['rows_exported'] is False
          assert binding['partitioning_enclave']['rows_purged'] is True
          assert binding['v017_runtime_domain']['executed_in_this_gate'] is False
          assert binding['v017_runtime_domain']['row_values_received'] is False
          assert binding['v017_runtime_domain']['sealed_test_values_received'] is False
          assert binding['v017_runtime_domain']['sealed_test_accessed'] is False
          assert binding['scientific_result'] is None
          assert binding['promotion']=='BLOCKED'
          assert binding['canonicalization']=='BLOCKED'
          for path in out.iterdir():
              assert path.suffix in {'.json'}, path
          PY

      - name: Persist safe binding receipts append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0175-real-calibration-binding"
          git config user.email "kch-helical-v0175-real-calibration-binding@users.noreply.github.com"
          git add "$ROOT/results"
          if git diff --cached --quiet; then
            echo "No binding delta"
          else
            git commit -m "record v0.17.5 real calibration input binding [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload safe binding receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0175-real-calibration-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROOT }}/results
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
