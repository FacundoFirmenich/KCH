name: NO-LIFT minimal replay wheels

on:
  push:
    branches: [tooling/no-lift-formal-assets-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download exact top-level wheels without dependency closure
        run: |
          set -euxo pipefail
          mkdir wheels
          python -m pip download --no-deps --only-binary=:all: --dest wheels \
            transformers==4.57.6 tokenizers==0.22.2 pyarrow==21.0.0 accelerate==1.11.0 huggingface_hub==0.36.0
          sha256sum wheels/* > WHEELS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: no-lift-python313-minimal-wheels-with-hub
          path: |
            wheels/
            WHEELS.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
