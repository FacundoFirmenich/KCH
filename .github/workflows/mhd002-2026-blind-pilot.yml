name: MHD002 prospective 2026 blind pilot

on:
  push:
    branches:
      - gate/mhd001-noaa-label-join-20261009
    paths:
      - .github/workflows/mhd002-2026-blind-pilot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  blind-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned blind-stage dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'astropy==7.0.0' 'drms==0.9.0'

      - name: Recover immutable 2010–2025 development census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '11613151191'
          EXPECTED_SHA256: 'b188e420b95d01cff065532832c93535754de4160c49dd6dbdf0301f9eab6c31'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mhd002/development-census"
          archive="$RUNNER_TEMP/mhd002/development-census.zip"
          curl --silent --show-error --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d "$RUNNER_TEMP/mhd002/development-census"

      - name: Acquire exact NOAA 2026 label body and metadata
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mhd002/noaa"
          mkdir -p "$root"
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/multi/l2/data/xrsf-l2-flrpt_science/csv'
          csv='sci_xrsf-l2-flrpt_geo_y2026_v1-0-1.csv'
          metadata='sci_xrsf-l2-flrpt_geo_metadata.json'
          curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --header 'Accept-Encoding: identity' \
            --dump-header "$root/$csv.headers" --output "$root/$csv" \
            --write-out '%{json}' "$base/$csv" > "$root/$csv.curl.json"
          curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --header 'Accept-Encoding: identity' \
            --dump-header "$root/$metadata.headers" --output "$root/$metadata" \
            --write-out '%{json}' "$base/$metadata" > "$root/$metadata.curl.json"
          test -s "$root/$csv"
          test -s "$root/$metadata"
          sha256sum "$root"/* > "$root/SOURCE_SHA256SUMS.txt"

      - name: Execute the prelocked prospective blind label gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mhd002/result"
          root="$RUNNER_TEMP/mhd002/noaa"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_mhd002/mhd002_blind_2026_pilot.py \
            --protocol .github/helical_mhd002/MHD002_PROSPECTIVE_INCREMENTAL_INFORMATION_GATE_LOCKED.json \
            --development-census-dir "$RUNNER_TEMP/mhd002/development-census" \
            --noaa-csv "$root/sci_xrsf-l2-flrpt_geo_y2026_v1-0-1.csv" \
            --noaa-metadata "$root/sci_xrsf-l2-flrpt_geo_metadata.json" \
            --output-dir "$out" \
            | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          printf '%s\n' "$rc" > "$out/SCIENTIFIC_EXIT_CODE.txt"

      - name: Seal prospective-pilot evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/mhd002/artifact"
          mkdir -p "$artifact"
          cp .github/helical_mhd002/MHD002_PROSPECTIVE_INCREMENTAL_INFORMATION_GATE_LOCKED.json "$artifact/"
          cp .github/helical_mhd002/mhd002_blind_2026_pilot.py "$artifact/"
          if [ -d "$RUNNER_TEMP/mhd002/noaa" ]; then cp -a "$RUNNER_TEMP/mhd002/noaa" "$artifact/noaa_exact_sources"; fi
          if [ -d "$RUNNER_TEMP/mhd002/result" ]; then cp -a "$RUNNER_TEMP/mhd002/result" "$artifact/result"; fi
          if [ -f "$RUNNER_TEMP/mhd002/development-census/BLIND_HARP_CENSUS.json" ]; then
            mkdir -p "$artifact/development-census-receipts"
            cp "$RUNNER_TEMP/mhd002/development-census/BLIND_HARP_CENSUS.json" "$artifact/development-census-receipts/"
            cp "$RUNNER_TEMP/mhd002/development-census/BLIND_HARP_SUMMARY.csv" "$artifact/development-census-receipts/"
          fi
          cd "$artifact"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          find . -type f -print0 | sort -z | xargs -0 -n1 stat --printf='%n\t%s bytes\n' > FILE_SIZES.txt

      - name: Upload sealed MHD002 pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-mhd002-2026-blind-pilot
          path: ${{ runner.temp }}/mhd002/artifact
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
