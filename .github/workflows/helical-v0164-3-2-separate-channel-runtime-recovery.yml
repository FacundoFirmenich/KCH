name: KCH Helical v0.16.4.3.2 separate-channel runtime recovery

on:
  push:
    branches:
      - helical-v0164-3-2-forensic-runtime-recovery-20261011
    paths:
      - ".github/workflows/helical-v0164-3-2-separate-channel-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0164-3-2-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT: construct_successors/KCH_HELICAL_V0164_3_FORENSIC_RUNTIME_RECOVERY_20261011
  RECOVER: construct_successors/KCH_HELICAL_V0164_3_FORENSIC_RUNTIME_RECOVERY_20261011/recover_separate_channels_v0164_3_2.py
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  separate-channel-runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete Git lineage
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0164-3-2-forensic-runtime-recovery-20261011
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify finite authority and predecessor failure
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/AUTHORITY_LEASE_V0_16_4_3_2.json" >/dev/null
          python -m json.tool "$ROOT/FAILURE_RECEIPT_V0_16_4_3_1_RUN1.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/v0164_3_2/pycache"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v0164_3_2/pycache" python -m py_compile "$RECOVER"

      - name: Recover compiler runtime and tests through exact separate channels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/recovered_separate_channels_exact" "$ROOT/receipts" "$RUNNER_TEMP/v0164_3_2/work"
          mkdir -p "$ROOT/receipts" "$RUNNER_TEMP/v0164_3_2/work"
          python "$RECOVER" \
            --repo-root "$GITHUB_WORKSPACE" \
            --root "$ROOT" \
            --scratch "$RUNNER_TEMP/v0164_3_2/work"

      - name: Prove exact code-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if find "$ROOT/recovered_separate_channels_exact" "$ROOT/receipts" -type f \( \
              -name '*.bin' -o -name '*.gz' -o -name '*.b64' -o -name '*.pickle' -o \
              -name '*.pkl' -o -name '*.npz' -o -name '*.npy' -o -name '*.csv' -o \
              -name '*.parquet' -o -name '*.geojson' -o -name '*.fits' -o \
              -name '*.sqlite' -o -name '*.db' -o -name '*.pyc' \
            \) | grep -q .; then
            echo "forbidden payload persisted across v0.16.4.3.2 boundary" >&2
            exit 91
          fi
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          receipt=json.loads((root/'receipts/SEPARATE_CHANNEL_RUNTIME_RECOVERY_RECEIPT_V0_16_4_3_2.json').read_text())
          validation=json.loads((root/'receipts/SEPARATE_CHANNEL_RUNTIME_RECOVERY_VALIDATION_V0_16_4_3_2.json').read_text())
          assert receipt['status']=='PASS'
          assert validation['status']=='PASS'
          assert validation['receipt_id']==receipt['receipt_id']
          assert receipt['compiler_channel']=='INDEPENDENT_GIT_BLOB_TRANSPORT'
          assert receipt['runtime_channel']=='VALID_COMPLETE_TAR_PREFIX_MEMBER'
          assert receipt['tests_channel']=='VALID_COMPLETE_TAR_PREFIX_MEMBER'
          assert receipt['target_count']==3
          assert receipt['source_bytes_modified'] is False
          assert receipt['incomplete_tar_members_recovered'] is False
          assert receipt['recovered_sources_imported'] is False
          assert receipt['recovered_sources_executed'] is False
          assert receipt['ledger_rows_regenerated'] is False
          assert receipt['scientific_data_accessed'] is False
          assert receipt['calibration_executed'] is False
          assert receipt['sealed_test_accessed'] is False
          assert receipt['scientific_result'] is None
          assert receipt['promotion']=='BLOCKED'
          assert receipt['canonicalization']=='BLOCKED'
          expected={
            'tools/freeze_null_perturbation_runtime.py',
            'src/kch_helical_dynamic_v08/null_runtime.py',
            'tests_v0_8_4/test_null_runtime.py',
          }
          observed={
            p.relative_to(root/'recovered_separate_channels_exact').as_posix()
            for p in (root/'recovered_separate_channels_exact').rglob('*.py')
          }
          assert observed==expected, (observed, expected)
          PY

      - name: Persist exact recovered sources and receipts append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0164-3-2-runtime-recovery"
          git config user.email "kch-helical-v0164-3-2-runtime-recovery@users.noreply.github.com"
          git add "$ROOT/recovered_separate_channels_exact" "$ROOT/receipts"
          if git diff --cached --quiet; then
            echo "No separate-channel recovery delta"
          else
            git commit -m "record v0.16.4.3.2 exact separate-channel runtime recovery [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload exact code-only runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0164-3-2-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROOT }}/recovered_separate_channels_exact
            ${{ env.ROOT }}/receipts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
