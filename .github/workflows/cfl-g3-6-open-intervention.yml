name: CFL G3.6 open intervention genesis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-g3-6:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r experiments/cfl_g3_6_open_intervention_20260928/requirements.txt
      - name: Materialize and verify runner
        run: |
          set -euo pipefail
          cp experiments/cfl_g3_6_open_intervention_20260928/run_g36.py.gz run_g36.py.gz
          echo "4b22f312ee3031bb6fc050b6a58c68c3d87d447abceba1bd56e29ca2f4931eeb  run_g36.py.gz" | sha256sum -c -
          gzip -dc run_g36.py.gz > run_g36.py
          echo "e5d25ffea67f615b08d78a35bd2acecea8095825692957df95ec6ef76f63e9a4  run_g36.py" | sha256sum -c -
          python -m py_compile run_g36.py
          python -m json.tool experiments/cfl_g3_6_open_intervention_20260928/EXECUTION_PROTOCOL.json >/dev/null
      - name: Execute G3.6
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          G36_WORKDIR: ${{ github.workspace }}/g36_work
        run: |
          set -euo pipefail
          python run_g36.py 2>&1 | tee g36_stdout.log
          test -s g36_work/results/FINAL_ADJUDICATION.json
          test -s g36_work/results/SUMMARY.json
          test -s g36_work/results/INTERVENTION_RESULTS.jsonl
          test -s g36_work/evidence/TRUTH_MANIFEST.jsonl
          python -m json.tool g36_work/results/FINAL_ADJUDICATION.json >/dev/null
          cp g36_stdout.log g36_work/results/STDOUT.log
          cp run_g36.py g36_work/results/SOURCE_run_g36.py
          cp experiments/cfl_g3_6_open_intervention_20260928/EXECUTION_PROTOCOL.json g36_work/results/EXECUTION_PROTOCOL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CFL_G3_6_OPEN_INTERVENTION_${{ github.sha }}
          path: g36_work
          if-no-files-found: warn
          retention-days: 30
