name: KCH Helical v0.17.2 textual capsule quorum

on:
  push:
    branches:
      - helical-v0172-textual-capsule-quorum-20261012
    paths:
      - ".github/workflows/helical-v0172-textual-capsule-quorum.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kch-helical-v0172-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT: construct_successors/KCH_HELICAL_V017_SPEC_DERIVED_NONIDENTICAL_RUNTIME_20261012
  LINEAGE: construct_successors/KCH_HELICAL_V0172_TEXTUAL_CAPSULE_QUORUM_20261012
  MANIFEST: .github/helical_v0172/TEXT_CHUNK_MANIFEST_V0_17_2.json
  BOOTSTRAP: .github/helical_v0172/bootstrap_v0172.py
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  verify-freeze-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout complete successor lineage
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: helical-v0172-textual-capsule-quorum-20261012
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify finite authority lineage and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$LINEAGE/AUTHORITY_LEASE_V0_17_2.json" >/dev/null
          python -m json.tool "$LINEAGE/FAILURE_RECEIPT_V0_17_1_RUN1.json" >/dev/null
          python -m json.tool "$MANIFEST" >/dev/null
          mkdir -p "$RUNNER_TEMP/v0172/pycache" "$RUNNER_TEMP/v0172/work"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v0172/pycache" python -m py_compile "$BOOTSTRAP"

      - name: Materialize test freeze and package runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/generated" "$ROOT/release" "$RUNNER_TEMP/v0172/work"
          mkdir -p "$RUNNER_TEMP/v0172/work"
          python "$BOOTSTRAP" \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST" \
            --root "$ROOT" \
            --work "$RUNNER_TEMP/v0172/work"

      - name: Prove terminal code-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1])
          receipt=json.loads((root/'BOOTSTRAP_RECEIPT_V0_17_2.json').read_text())
          transport=json.loads((root/'TEXT_CAPSULE_MATERIALIZATION_RECEIPT_V0_17_2.json').read_text())
          release=json.loads((root/'release/RELEASE_RECEIPT_V0_17_2.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['unit_test_count_each']==44
          assert receipt['unit_test_total_executions']==88
          assert receipt['double_freeze_identity']=='PASS'
          assert receipt['scheduled_job_count']==6376
          assert receipt['runtime_contract_id'].startswith('h17nullspec:')
          assert receipt['job_ledger_id'].startswith('h17nullledger:')
          assert receipt['historical_identity_transferred'] is False
          assert receipt['scientific_data_accessed'] is False
          assert receipt['calibration_runtime_qualification_executed'] is False
          assert receipt['sealed_test_accessed'] is False
          assert receipt['scientific_result'] is None
          assert receipt['promotion']=='BLOCKED'
          assert receipt['canonicalization']=='BLOCKED'
          assert transport['status']=='PASS' and transport['chunk_count']==9
          assert release['status']=='PASS' and release['zip_crc']=='PASS'
          assert release['member_hash_identity']=='PASS'
          assert release['scientific_data_included'] is False
          assert release['calibration_executed'] is False
          assert release['sealed_test_accessed'] is False
          assert release['scientific_result'] is None
          PY
          if find "$ROOT" -type f \( \
              -name '*.pickle' -o -name '*.pkl' -o -name '*.npz' -o -name '*.npy' -o \
              -name '*.csv' -o -name '*.parquet' -o -name '*.geojson' -o -name '*.fits' -o \
              -name '*.sqlite' -o -name '*.db' -o -name '*.pyc' \
            \) | grep -q .; then
            echo "forbidden payload persisted across v0.17.2 boundary" >&2
            exit 91
          fi

      - name: Persist runtime freeze and release append-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kch-helical-v0172-runtime"
          git config user.email "kch-helical-v0172-runtime@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then
            echo "No v0.17.2 runtime delta"
          else
            git commit -m "record v0.17.2 specification-derived runtime freeze [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload frozen v0.17.2 release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kch-helical-v0172-spec-derived-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROOT }}/generated
            ${{ env.ROOT }}/release
            ${{ env.ROOT }}/BOOTSTRAP_RECEIPT_V0_17_2.json
            ${{ env.ROOT }}/TEXT_CAPSULE_MATERIALIZATION_RECEIPT_V0_17_2.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
