name: Helical v1.1 disjoint selected-event directional acquisition

on:
  push:
    branches:
      - gate/helical-v11-mhd-execution-seismic-terminal-20261011
    paths:
      - .github/workflows/helical-v11-seismic-directional-acquisition-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned acquisition stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'aiohttp==3.10.10' 'pandas==2.2.3'
      - name: Verify terminal protocol was locked before this run
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "LOCKED_BEFORE_REAL_MECHANISM_ANGLE_ACCESS" and .directional_fields_accessed_before_lock == false and .network_lock_id == "s11net:67ed98bec7602ce1de9f2a86196f5894549fa4fc1fb66a577b0e2f7a51fe540f"' \
            .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json >/dev/null
      - name: Recover immutable disjoint full-network lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seismic_network_lock"
          gh run download 38165177631 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v11-seismic-network-lock-v3-disjoint \
            --dir "$RUNNER_TEMP/seismic_network_lock"
      - name: Acquire exact event-detail bodies and materialize selected nodal planes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/seismic_directional"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_v11/seismic_directional_acquisition.py \
            --network-root "$RUNNER_TEMP/seismic_network_lock" \
            --out "$out" 2>&1 | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/EXIT_CODE.txt"
          cp .github/helical_v11/SEISMIC_TERMINAL_FULL_NETWORK_GATE_V1_1_LOCKED.json "$out/"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - name: Upload sealed directional acquisition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v11-seismic-directional-acquisition-v2
          path: ${{ runner.temp }}/seismic_directional
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
