name: KCH Helical v0.10 remote exact-byte gate

on:
  push:
    branches:
      - helical-v09-remote-gate-20261009
    paths:
      - "construct_successors/helical_v10_capsule_parts/**"
      - "construct_successors/KCH_HELICAL_V10_REMOTE_EXECUTION_CAPSULE_2026-10-09.tar.gz.sha256"
      - ".github/workflows/kch-helical-v10-remote-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kch-helical-v10-remote-gate
  cancel-in-progress: false

jobs:
  exact-byte-to-blind:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      CAPSULE_PARTS_DIR: construct_successors/helical_v10_capsule_parts
      CAPSULE_B64_BYTES: "38012"
      CAPSULE_B64_SHA256: 8c0dc5431526dea38b6293df89bba490827d7ebba38d9401d5e1c4cd3b2c22fe
      CAPSULE_ARCHIVE_SHA256: 111be417871ee951e8487f35e29a5d99c328a1a9ae3951ba5534d8adb846dc27

    steps:
      - name: Checkout immutable source revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Python 3.11 using immutable action commit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Initialize append-only run evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helical-v10/receipts"
          printf '%s\n' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}" \
            > "$RUNNER_TEMP/helical-v10/receipts/RUN_IDENTITY.txt"

      - name: Reassemble, decode, and verify frozen capsule
        id: capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule"
          cd "$GITHUB_WORKSPACE"
          cat > "$RUNNER_TEMP/capsule/PARTS.sha256" <<'PARTS'
          c352abe67d9e338f4068db8e676916e211c24fdd0c99d7b56d95d8c343905356  construct_successors/helical_v10_capsule_parts/part-000.b64
          f7ad095141b479654c62fc5cb71c51ff9c04b870e241bf8f2adde28b46554a03  construct_successors/helical_v10_capsule_parts/part-001.b64
          0702feface0e886a246ab434571b4f092b08d3cf9cab562a17e38387e7ac7725  construct_successors/helical_v10_capsule_parts/part-002.b64
          98d474a8f84da5145584b6b9ede0e224eab25fd23122ced6ab630dea243b7e4a  construct_successors/helical_v10_capsule_parts/part-003.b64
          63413fc87e70ffb20a0bd8d8147f8753c5888434f010b98b53f29f1e0d7a8fbf  construct_successors/helical_v10_capsule_parts/part-004.b64
          536de33319488137518d830cadbdc52517ac135588ce799a4e250b0447f44092  construct_successors/helical_v10_capsule_parts/part-005.b64
          539730cb0bc7280eaf2aea577eeb83ec678c3336f21af66a3c5d1c52199aa6a3  construct_successors/helical_v10_capsule_parts/part-006.b64
          PARTS
          sha256sum -c "$RUNNER_TEMP/capsule/PARTS.sha256"
          cat "$CAPSULE_PARTS_DIR"/part-{000..006}.b64 > "$RUNNER_TEMP/capsule/capsule.b64"
          test "$(wc -c < "$RUNNER_TEMP/capsule/capsule.b64")" -eq "$CAPSULE_B64_BYTES"
          observed_b64="$(sha256sum "$RUNNER_TEMP/capsule/capsule.b64" | awk '{print $1}')"
          test "$observed_b64" = "$CAPSULE_B64_SHA256"
          base64 -d "$RUNNER_TEMP/capsule/capsule.b64" > "$RUNNER_TEMP/capsule/capsule.tar.gz"
          observed_archive="$(sha256sum "$RUNNER_TEMP/capsule/capsule.tar.gz" | awk '{print $1}')"
          test "$observed_archive" = "$CAPSULE_ARCHIVE_SHA256"
          tar -xzf "$RUNNER_TEMP/capsule/capsule.tar.gz" -C "$RUNNER_TEMP/capsule"
          root="$RUNNER_TEMP/capsule/KCH_HELICAL_V10_REMOTE_EXECUTION_CAPSULE_2026-10-09"
          test -f "$root/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          python - <<'PYRECEIPT'
          import hashlib, json, os, pathlib
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          obj = {
              "capsule_parts": 7,
              "base64_bytes": 38012,
              "base64_sha256": os.environ["CAPSULE_B64_SHA256"],
              "archive_sha256": os.environ["CAPSULE_ARCHIVE_SHA256"],
              "outcome": "CAPSULE_TRANSPORT_PASS",
          }
          p = runner / "helical-v10" / "receipts" / "CAPSULE_TRANSPORT_RECEIPT.json"
          p.write_text(json.dumps(obj, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PYRECEIPT

      - name: Install frozen runtime dependencies
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.capsule.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$CAPSULE_ROOT/requirements-runtime.txt"
          python -m pip freeze --all | LC_ALL=C sort > "$RUNNER_TEMP/helical-v10/receipts/PIP_FREEZE.txt"
          python - <<'PYENV'
          import hashlib, json, os, pathlib, platform, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "helical-v10" / "receipts"
          freeze = (root / "PIP_FREEZE.txt").read_bytes()
          (root / "RUNTIME_ENVIRONMENT.json").write_text(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "pip_freeze_sha256": hashlib.sha256(freeze).hexdigest(),
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PYENV

      - name: Verify capsule invariants and dry-run boundary
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.capsule.outputs.root }}
        run: |
          set -euo pipefail
          python -m compileall -q "$CAPSULE_ROOT/runtime"
          test "$(grep -Rho 'pickle\.load' "$CAPSULE_ROOT/runtime" | wc -l)" -eq 1
          ! grep -R 'from \.core' "$CAPSULE_ROOT/runtime/kch_helical_dynamic_v08/eligibility.py"
          ! grep -R 'scipy' "$CAPSULE_ROOT/runtime/kch_helical_dynamic_v08/eligibility.py"
          set +e
          python "$CAPSULE_ROOT/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py" \
            --workspace "$RUNNER_TEMP/helical-v10-dry-run"
          rc=$?
          set -e
          test "$rc" -eq 4
          python - <<'PYDRY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "helical-v10-dry-run" / "receipts" / "GATE_EXECUTION_RECEIPT_V0_9.json"
          obj = json.loads(p.read_text(encoding="utf-8"))
          assert obj["outcome"] == "DRY_RUN_NO_EFFECT"
          assert obj["directional_fields_unsealed"] is False
          assert obj["model_fitting_performed"] is False
          assert obj["authority_ceiling"] == "NONE"
          PYDRY

      - name: Execute exact-byte acquisition, hardened extraction, and blind eligibility
        id: gate
        shell: bash
        env:
          CAPSULE_ROOT: ${{ steps.capsule.outputs.root }}
        run: |
          set +e
          python "$CAPSULE_ROOT/runtime/RUN_EXACT_BYTE_TO_BLIND_GATE_V0_9.py" \
            --workspace "$RUNNER_TEMP/helical-v10" \
            --execute-network \
            --network-timeout-seconds 600 \
            --sandbox-timeout-seconds 5400 \
            --sandbox-memory-mib 8192 \
            --purge-raw-after-gate
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/helical-v10/receipts/GATE_EXIT_CODE.txt"
          echo "gate_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert raw and partial sources are absent from export surface
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/helical-v10/exact_sources"
          test ! -e "$RUNNER_TEMP/helical-v10/cache/focmec_ca_final.pickle"
          if [[ -d "$RUNNER_TEMP/helical-v10" ]]; then
            test -z "$(find "$RUNNER_TEMP/helical-v10" -type f \( -name '*.pickle' -o -name '*.part' \) -print -quit)"
          fi

      - name: Build deterministic non-raw evidence archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helical-v10/receipts"
          cd "$RUNNER_TEMP/helical-v10"
          paths=(receipts)
          for candidate in blind eligibility; do
            [[ -e "$candidate" ]] && paths+=("$candidate")
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf helical-v10-result-without-raw-sources.tar.gz "${paths[@]}"
          sha256sum helical-v10-result-without-raw-sources.tar.gz \
            > helical-v10-result-without-raw-sources.tar.gz.sha256

      - name: Upload receipts and safe derived artifacts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kch-helical-v10-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/helical-v10/helical-v10-result-without-raw-sources.tar.gz
            ${{ runner.temp }}/helical-v10/helical-v10-result-without-raw-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Adjudicate only after evidence upload
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.gate_exit_code }}
        run: |
          set -euo pipefail
          case "${GATE_EXIT_CODE:-99}" in
            0)  echo "ELIGIBILITY_PASS_DIRECTIONAL_UNSEAL_REQUEST_READY" ;;
            30) echo "LEGITIMATE_NOT_IDENTIFIABLE_MECHANISM_COVERAGE" ;;
            *)  echo "Infrastructure or transport gate failed with exit ${GATE_EXIT_CODE:-99}" >&2; exit "${GATE_EXIT_CODE:-99}" ;;
          esac
