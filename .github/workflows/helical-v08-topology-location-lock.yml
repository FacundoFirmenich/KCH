name: Helical v0.8 topology and location-perturbation lock

on:
  push:
    branches:
      - gate/helical-v08-dynamic-confirmatory-20260927
    paths:
      - .github/workflows/helical-v08-topology-location-lock.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned geometry stack
        run: python -m pip install 'numpy==2.1.3' 'pyproj==3.7.0' 'shapely==2.0.6'
      - name: Recover immutable v0.8.1 and ComCat material artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_artifact() {
            id="$1"; expected="$2"; dest="$3"
            zip="$RUNNER_TEMP/$id.zip"
            curl --fail-with-body --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" --output "$zip"
            test "$(sha256sum "$zip"|awk '{print $1}')" = "$expected"
            mkdir -p "$dest"; unzip -q "$zip" -d "$dest"
          }
          download_artifact 10934329977 ba2858030909b02c83ae107b062cce705bf6f485834c3e556c328dcd8d81e066 "$RUNNER_TEMP/selected"
          download_artifact 10936987975 8aaa2ec42950717bd19a5572f7e26eb0a1ba6fabb94622d8a7606c6dbafb0ad8 "$RUNNER_TEMP/crosswalk"
      - name: Acquire pinned GEM fault network
        shell: bash
        run: |
          set -euo pipefail
          fault="$RUNNER_TEMP/gem_active_faults_harmonized.geojson"
          curl --fail-with-body --location \
            'https://raw.githubusercontent.com/GEMScienceTools/gem-global-active-faults/56816508ad92fd6846dad1163b1c8c01376a2cd1/geojson/gem_active_faults_harmonized.geojson' \
            --output "$fault"
          test "$(sha256sum "$fault"|awk '{print $1}')" = '37babb516edfac22b5ae91744495d8546b3ae4676b4d4f68cc77da8222df20e1'
      - name: Lock topology and conservative location perturbation operator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/topology_lock"
          PYTHONUNBUFFERED=1 python .github/helical_v08/lock_topology_and_location_operator.py \
            --selected-artifact-root "$RUNNER_TEMP/selected" \
            --crosswalk-root "$RUNNER_TEMP/crosswalk" \
            --fault-geojson "$RUNNER_TEMP/gem_active_faults_harmonized.geojson" \
            --out "$RUNNER_TEMP/topology_lock" | tee "$RUNNER_TEMP/topology_lock/STDOUT.log"
          find "$RUNNER_TEMP/topology_lock" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/topology_lock/SHA256SUMS.txt"
      - name: Upload topology/operator lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v08-topology-location-operator-lock
          path: ${{ runner.temp }}/topology_lock
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
