name: NO-LIFT fetch CERTID public artifact

on:
  push:
    branches:
      - tooling/no-lift-formal-assets-v1
    paths:
      - tooling/fetch_anonymous_4open_repo.py
      - .github/workflows/no-lift-fetch-certid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-certid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch CERTID anonymous repository
        run: |
          python tooling/fetch_anonymous_4open_repo.py \
            --repo-id certid-D718 \
            --output certid-D718 \
            --workers 12 | tee CERTID_ACQUISITION_OUTPUT.json
      - name: Inventory and hash acquisition receipt
        run: |
          find certid-D718 -type f | sort > CERTID_FILE_LIST.txt
          sha256sum CERTID_ACQUISITION_OUTPUT.json CERTID_FILE_LIST.txt \
            certid-D718/ACQUISITION_MANIFEST.json certid-D718/MANIFEST.sha256 \
            > CERTID_ACQUISITION_RECEIPT.sha256
          du -sh certid-D718 | tee CERTID_SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: no-lift-certid-D718
          path: |
            certid-D718/
            CERTID_ACQUISITION_OUTPUT.json
            CERTID_FILE_LIST.txt
            CERTID_ACQUISITION_RECEIPT.sha256
            CERTID_SIZE.txt
          if-no-files-found: error
          retention-days: 14
