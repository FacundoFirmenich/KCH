name: NO-LIFT fetch CERTID public artifact

on:
  push:
    branches:
      - tooling/no-lift-formal-assets-v1
    paths:
      - tooling/fetch_anonymous_4open_repo.py
      - .github/workflows/no-lift-fetch-certid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-certid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch CERTID anonymous repository
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python tooling/fetch_anonymous_4open_repo.py \
            --repo-id certid-D718 \
            --output certid-D718 \
            --workers 12 2>&1 | tee CERTID_ACQUISITION_OUTPUT.txt
          echo "${PIPESTATUS[0]}" > CERTID_FETCH_EXIT_CODE.txt
      - name: Inventory and hash acquisition receipt
        if: always()
        run: |
          test -f CERTID_FETCH_EXIT_CODE.txt || echo 99 > CERTID_FETCH_EXIT_CODE.txt
          find certid-D718 -type f 2>/dev/null | sort > CERTID_FILE_LIST.txt || true
          if test -f certid-D718/ACQUISITION_MANIFEST.json && test -f certid-D718/MANIFEST.sha256; then
            sha256sum CERTID_ACQUISITION_OUTPUT.txt CERTID_FILE_LIST.txt \
              CERTID_FETCH_EXIT_CODE.txt certid-D718/ACQUISITION_MANIFEST.json \
              certid-D718/MANIFEST.sha256 > CERTID_ACQUISITION_RECEIPT.sha256
            du -sh certid-D718 | tee CERTID_SIZE.txt
          else
            python - <<'PY'
          import json
          from pathlib import Path
          output = Path('CERTID_ACQUISITION_OUTPUT.txt').read_text(errors='replace') if Path('CERTID_ACQUISITION_OUTPUT.txt').exists() else ''
          payload = {
              'status': 'FAIL_CLOSED',
              'repo_id': 'certid-D718',
              'exit_code': int(Path('CERTID_FETCH_EXIT_CODE.txt').read_text().strip()),
              'manifest_present': Path('certid-D718/ACQUISITION_MANIFEST.json').exists(),
              'last_output_lines': output.splitlines()[-40:],
          }
          Path('CERTID_ACQUISITION_FAILURE.json').write_text(json.dumps(payload, indent=2, sort_keys=True))
          PY
            sha256sum CERTID_ACQUISITION_OUTPUT.txt CERTID_FILE_LIST.txt \
              CERTID_FETCH_EXIT_CODE.txt CERTID_ACQUISITION_FAILURE.json \
              > CERTID_ACQUISITION_RECEIPT.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-lift-certid-D718
          path: |
            certid-D718/
            CERTID_ACQUISITION_OUTPUT.txt
            CERTID_FETCH_EXIT_CODE.txt
            CERTID_FILE_LIST.txt
            CERTID_ACQUISITION_FAILURE.json
            CERTID_ACQUISITION_RECEIPT.sha256
            CERTID_SIZE.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce fail-closed acquisition
        if: always()
        run: test "$(cat CERTID_FETCH_EXIT_CODE.txt)" -eq 0
