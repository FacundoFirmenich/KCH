name: MHD001 exact NOAA blind label join

on:
  push:
    branches:
      - gate/mhd001-noaa-label-join-20261009
    paths:
      - .github/workflows/mhd001-noaa-blind-label-join.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-label-join:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned tabular and time-scale dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'astropy==7.0.0'

      - name: Recover immutable blind HARP census artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '11613151191'
          EXPECTED_SHA256: 'b188e420b95d01cff065532832c93535754de4160c49dd6dbdf0301f9eab6c31'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mhd001/census"
          archive="$RUNNER_TEMP/mhd001/census.zip"
          curl --silent --show-error --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          observed=$(sha256sum "$archive" | awk '{print $1}')
          test "$observed" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d "$RUNNER_TEMP/mhd001/census"

      - name: Acquire exact NOAA NCEI flare-report entities
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/mhd001/noaa"
          mkdir -p "$source_dir"
          csv_url='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/multi/l2/data/xrsf-l2-flrpt_science/csv/sci_xrsf-l2-flrpt_geo_s19950103_e20260809_v1-0-1.csv'
          metadata_url='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/multi/l2/data/xrsf-l2-flrpt_science/csv/sci_xrsf-l2-flrpt_geo_metadata.json'
          curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 --header 'Accept-Encoding: identity' \
            --dump-header "$source_dir/flare.headers" \
            --output "$source_dir/flare.csv" \
            --write-out '%{json}' "$csv_url" > "$source_dir/flare.curl.json"
          curl --silent --show-error --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --header 'Accept-Encoding: identity' \
            --dump-header "$source_dir/metadata.headers" \
            --output "$source_dir/metadata.json" \
            --write-out '%{json}' "$metadata_url" > "$source_dir/metadata.curl.json"
          test -s "$source_dir/flare.csv"
          test -s "$source_dir/metadata.json"
          sha256sum "$source_dir"/* > "$source_dir/SOURCE_SHA256SUMS.txt"

      - name: Execute the prelocked blind association and identifiability gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mhd001/result"
          mkdir -p "$out"
          set +e
          PYTHONUNBUFFERED=1 python .github/helical_mhd001/noaa_blind_label_join.py \
            --protocol .github/helical_mhd001/MHD001_NOAA_LABEL_JOIN_LOCKED.json \
            --census-dir "$RUNNER_TEMP/mhd001/census" \
            --flare-csv "$RUNNER_TEMP/mhd001/noaa/flare.csv" \
            --flare-metadata "$RUNNER_TEMP/mhd001/noaa/metadata.json" \
            --flare-curl-meta "$RUNNER_TEMP/mhd001/noaa/flare.curl.json" \
            --metadata-curl-meta "$RUNNER_TEMP/mhd001/noaa/metadata.curl.json" \
            --output-dir "$out" \
            | tee "$out/EXECUTION_STDOUT.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          printf '%s\n' "$rc" > "$out/SCIENTIFIC_EXIT_CODE.txt"

      - name: Seal evidence tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/mhd001/artifact"
          mkdir -p "$artifact"
          cp .github/helical_mhd001/MHD001_NOAA_LABEL_JOIN_LOCKED.json "$artifact/"
          cp .github/helical_mhd001/noaa_blind_label_join.py "$artifact/"
          if [ -d "$RUNNER_TEMP/mhd001/noaa" ]; then cp -a "$RUNNER_TEMP/mhd001/noaa" "$artifact/noaa_exact_sources"; fi
          if [ -d "$RUNNER_TEMP/mhd001/result" ]; then cp -a "$RUNNER_TEMP/mhd001/result" "$artifact/result"; fi
          if [ -f "$RUNNER_TEMP/mhd001/census/BLIND_HARP_CENSUS.json" ]; then
            mkdir -p "$artifact/census_receipts"
            cp "$RUNNER_TEMP/mhd001/census/BLIND_HARP_CENSUS.json" "$artifact/census_receipts/"
            cp "$RUNNER_TEMP/mhd001/census/BLIND_HARP_SUMMARY.csv" "$artifact/census_receipts/"
          fi
          cd "$artifact"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          find . -type f -print0 | sort -z | xargs -0 -n1 stat --printf='%n\t%s bytes\n' > FILE_SIZES.txt

      - name: Upload sealed NOAA blind-label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-mhd001-noaa-blind-label-join
          path: ${{ runner.temp }}/mhd001/artifact
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
