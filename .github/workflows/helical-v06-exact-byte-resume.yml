name: Helical v0.6 exact-byte resume gate

on:
  push:
    branches:
      - gate/helical-v06-byte-quorum-resume-20260927
    paths:
      - .github/workflows/helical-v06-exact-byte-resume.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execute-locked-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned numerical environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scikit-learn==1.5.2'

      - name: Recover exact probe artifact containing official provider bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v06_probe_artifact"
          gh run download 36289187730 \
            --repo "$GITHUB_REPOSITORY" \
            --name kch-helical-v06-fast-byte-route-probe \
            --dir "$RUNNER_TEMP/v06_probe_artifact"

      - name: Recover the single-character runtime carrier defect against the prelock hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v06_resume_artifact"
          python .github/helical_v06_transport/repair_single_missing_base64_char.py \
            --input .github/helical_v06_bundle/chunk_01 \
            --receipt "$RUNNER_TEMP/v06_resume_artifact/TRANSPORT_REPAIR_RECEIPT.json"

      - name: Execute unchanged locked v0.6 protocol on exact official bytes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python .github/helical_v06_transport/execute_locked_v06_from_probe.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --probe-artifact-root "$RUNNER_TEMP/v06_probe_artifact" \
            --work-root "$RUNNER_TEMP/v06_resume_work" \
            --artifact-root "$RUNNER_TEMP/v06_resume_artifact"

      - name: Upload sealed v0.6 scientific result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kch-helical-v06-exact-byte-resume-result
          path: ${{ runner.temp }}/v06_resume_artifact
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
