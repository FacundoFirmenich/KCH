name: NO-LIFT GitHub Models smoke gate

on:
  push:
    branches:
      - no-lift-github-models-smoke-v1.0.0
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Independent GitHub Models smoke call
        shell: bash
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > request.json
          import json
          from pathlib import Path
          prompt=Path('no_lift/github_models_smoke_v1_0_0/prompt.txt').read_text()
          payload={
            'model':'openai/gpt-4.1',
            'temperature':0,
            'max_tokens':200,
            'messages':[
              {'role':'system','content':'You are an independent machine-readable scientific adjudicator. Output exactly the requested JSON.'},
              {'role':'user','content':prompt}
            ]
          }
          print(json.dumps(payload))
          PY
          code=$(curl -sS -D response_headers.txt -o response_body.bin -w '%{http_code}' \
            -X POST 'https://models.github.ai/inference/chat/completions' \
            -H "Authorization: Bearer ${GH_MODELS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @request.json)
          printf '%s\n' "$code" > http_status.txt
          python - <<'PY'
          from pathlib import Path
          b=Path('response_body.bin').read_bytes()
          Path('response_body_hex.txt').write_text(b[:512].hex()+'\n')
          Path('response_body_repr.txt').write_text(repr(b[:2048])+'\n')
          print('body_bytes=',len(b))
          print('body_repr=',repr(b[:256]))
          PY
          test "$code" = '200'

      - name: Parse response if possible
        id: parse
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          envelope=json.loads(Path('response_body.bin').read_text())
          text=envelope['choices'][0]['message']['content'].strip()
          Path('github_models_smoke_raw.txt').write_text(text+'\n')
          if text.startswith('```'):
              text=text.split('\n',1)[1].rsplit('```',1)[0].strip()
          data=json.loads(text)
          expected={'status':'PASS','gate':'GITHUB_MODELS_SMOKE','independent':True}
          assert data == expected, (data, expected)
          Path('github_models_smoke.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          metadata={
            'model': envelope.get('model'),
            'id': envelope.get('id'),
            'usage': envelope.get('usage'),
            'http_status': 200,
            'authority':'INDEPENDENT_MODEL_SMOKE_ONLY'
          }
          Path('github_models_smoke_receipt.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n')
          PY

      - name: Hash diagnostic artifacts
        if: always()
        shell: bash
        run: |
          sha256sum request.json response_body.bin response_headers.txt http_status.txt response_body_hex.txt response_body_repr.txt > diagnostic.sha256
          if test -f github_models_smoke.json; then sha256sum github_models_smoke.json github_models_smoke_receipt.json >> diagnostic.sha256; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-lift-github-models-smoke-v1.0.0
          path: |
            request.json
            response_body.bin
            response_headers.txt
            response_body_hex.txt
            response_body_repr.txt
            http_status.txt
            diagnostic.sha256
            github_models_smoke.json
            github_models_smoke_raw.txt
            github_models_smoke_receipt.json
          if-no-files-found: error
          retention-days: 30
