[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kch-kwantau-authority"
version = "0.1.0"
description = "Transactional bridge from KCH Native one-shot authority to KwanTau constitutional execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kch-kwantau-authority = "kch_kwantau_authority.stdio_server:main"

[tool.setuptools.packages.find]
where = ["src"]
