[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kch-composed-runtime"
version = "0.1.0"
description = "Additive KCH execution, scoped memory and typed decision sensors"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kch-composed = "kch_composed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
